<script>
  // Capture install prompt
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    // Show the install button in header
    const btn = document.getElementById('pwa-btn');
    if (btn) btn.style.display = 'flex';
  });

  // Hide button if already installed
  window.addEventListener('appinstalled', () => {
    const btn = document.getElementById('pwa-btn');
    if (btn) btn.style.display = 'none';
  });

  window.installPWA = function installPWA() {
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isStandalone = window.navigator.standalone;

    if (deferredPrompt) {
      // Android / Chrome — native prompt
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(() => {
        deferredPrompt = null;
        const btn = document.getElementById('pwa-btn');
        if (btn) btn.style.display = 'none';
      });
    } else if (isIOS && !isStandalone) {
      // iOS — show instructions overlay
      document.getElementById('ios-overlay').style.display = 'flex';
    } else {
      // Fallback for other browsers
      alert('To install: open this page in Chrome or Safari and use the browser menu to Add to Home Screen.');
    }
  }
</script>

const DEFAULT_PLACES = {
  beaches: [
    { id:"b1",  name:"Paradise Beach",   emoji:"🏖️", cat:"beaches", desc:"The most famous beach on Kos, long golden sand, turquoise water, beach bars and water sports. Lively and popular with all ages.", tip:"Go before 10am in peak summer to get a sunbed. Gets very busy by noon!", rating:"4.8", lat:36.76066, lng:27.007513},
    { id:"b2",  name:"Tigaki Beach",     emoji:"🌊", cat:"beaches", desc:"A favourite with locals for decades. Wide sandy beach with warm shallow water, perfect for families. Frequently awarded Blue Flag status.", tip:"The shallow water makes it ideal for kids. Head to the eastern end for fewer crowds.", rating:"4.7", lat:36.890024, lng:27.183137},
    { id:"b3",  name:"Agios Stefanos",   emoji:"⛵", cat:"beaches", desc:"Breathtaking beach facing the tiny islet of Kastri, topped with a ruined basilica. One of the most photogenic spots on the island.", tip:"Swim across to Kastri, it's only about 200m! Watch for boat traffic.", rating:"4.9", lat:36.752678, lng:26.988678},
    { id:"b4",  name:"Camel Beach",      emoji:"🐪", cat:"beaches", desc:"Secluded pebble and pink-sand cove with some of the clearest water on the island. Peaceful and relatively unknown.", tip:"Bring water shoes for the pebbles. Access by a short dirt track or boat from Paradise Beach.", rating:"4.7", lat:36.756881, lng:26.999818},
    { id:"b5",  name:"Cavo Paradiso",    emoji:"🌿", cat:"beaches", desc:"Widely regarded as the most beautiful beach on Kos. A pristine bay flanked by cliffs and dunes with a small cedar forest. Barely touched by tourism.", tip:"Bring everything you need as there are no facilities here. Worth every effort to reach.", rating:"4.9", lat:36.68491, lng:26.948058},
    { id:"b6",  name:"Marmari Beach",    emoji:"🏄", cat:"beaches", desc:"Long north-coast sandy beach lined with restaurants and accommodation. Great for windsurfing thanks to reliable Aegean breezes.", tip:"The western section is quieter. Several windsurfing schools operate here.", rating:"4.5", lat:36.880457, lng:27.145344},
    { id:"b7",  name:"Mastichari Beach", emoji:"🐚", cat:"beaches", desc:"Exotic setting with soft white sand and emerald water. One of the busiest beaches on the island with many watersports centres and a nearby ferry port.", tip:"Take the ferry from here to Kalymnos for a perfect day trip.", rating:"4.6", lat:36.849224, lng:27.074746},
    { id:"b8",  name:"Kardamena Beach",  emoji:"🎉", cat:"beaches", desc:"Sparkling white sand with both organised and unorganised sections. A buzzing resort beach with bars, restaurants and all amenities close by.", tip:"The eastern end is quieter if you want to escape the music.", rating:"4.4", lat:36.780399, lng:27.142491},
    
    { id:"b10", name:"Thermes Beach",    emoji:"♨️", cat:"beaches", desc:"Unique beach with natural hot thermal springs flowing directly into the sea, creating warm pools at the water's edge. A truly one-of-a-kind experience.", tip:"Come at sunrise or early morning when it is quiet. Before you go, check with your hotel whether the thermal baths have been dug out, as after every winter the storms fill them with sand and it can take a while before someone clears them.", rating:"4.7", lat:36.844618, lng:27.316514},
    { id:"b11", name:"Psalidi Beach",    emoji:"🤿", cat:"beaches", desc:"Pebble and sand beach close to Kos Town, known for excellent clarity and snorkelling. Windsurfers and kitesurfers flock here for the reliable winds.", tip:"A great snorkelling spot and the pebbles keep the water crystal clear. Bring your mask!", rating:"4.5", lat:36.887097, lng:27.332417},
    { id:"b12", name:"Agios Fokas",      emoji:"🪨", cat:"beaches", desc:"Dramatic pebble beach 8km from Kos Town, popular with divers for its super-clear water and shale shore. Quieter and more rugged than the sandy beaches.", tip:"Book a dive course here, visibility is exceptional. Bring proper footwear for the stones.", rating:"4.6", lat:36.857862, lng:27.350147},
    { id:"b13", name:"Lambi Beach",      emoji:"🌈", cat:"beaches", desc:"Famous for its rainbow-coloured pebbles as much as its sea. Close to Kos Town, with great tavernas and bars right on the waterfront.", tip:"Collect a few of the colourful pebbles as a unique souvenir, but leave most behind!", rating:"4.5", lat:36.905269, lng:27.284944},
    { id:"b14", name:"Limnionas Beach",  emoji:"🏝️", cat:"beaches", desc:"Secluded rocky cove on the Kefalos peninsula, surrounded by rugged scenery. Small, intimate and far from the tourist crowds.", tip:"There is a lovely little taverna right on the rocks. Try the fresh grilled fish.", rating:"4.8", lat:36.773814, lng:26.962655},
    { id:"b15", name:"Kos Town Beach",   emoji:"🎵", cat:"beaches", desc:"Lively and popular beach close to Kos Town with beach bars, loud music, restaurants and cafes. A fun party atmosphere from morning to night.", tip:"This is the place if you want music and energy. Head elsewhere if you want peace and quiet!", rating:"4.3", lat:36.900767, lng:27.285721},
    { id:"b16", name:"Agios Theologos", emoji:"✝️", cat:"beaches", desc:"Remote, wild beach on the southwestern tip of Kos near Kefalos. Crystal clear water, gentle slope into the sea, and barely any crowds even in summer.", tip:"A hidden gem. There is a wonderful traditional taverna at the end of the road, do not miss it.", rating:"4.9", lat:36.713556, lng:26.921971},
  ],
  restaurants: [
    { id:"r1", hours:"09:00-00:00",  name:"Platanos", cat:"restaurants", phone:"+30 6944141631", website:"https://platanoskos.gr/", social:"https://www.instagram.com/platanoskos/",  desc:"Iconic taverna sitting under ancient plane trees beside the Castle of the Knights. Classic Greek menu and the most atmospheric dining spot in Kos Town.", tip:"Book ahead in summer, it fills up fast. Ask for a table outside under the trees.", rating:"4.7", lat:36.894593, lng:27.291071 },
    { id:"r2", hours:"18:00-24:00",  name:"To Petrino", cat:"restaurants", phone:"+30 22420 27251", website:"https://petrino-kos.gr/", social:"https://www.instagram.com/petrino_kos/",  desc:"Elegant stone-walled restaurant in a garden courtyard in Kos Town. Upscale and romantic, with pork loin, sea bass, local cheeses and a 120-label wine list.", tip:"Perfect for a special evening. The krasotiri cheese aged in red wine is a must-try.", rating:"4.9", lat:36.892059, lng:27.285543 },
    { id:"r3", hours:"13:00-23:00",  name:"Lambros Steakhouse", cat:"restaurants", phone:"+30 22420 28808", website:"https://www.lamprossteakhouse.gr/", social:"https://www.instagram.com/lampros.steakhouse",  desc:"Legendary Kos institution on Psaron Street. Serves only Greek grilled meat, pork ribs, souvlaki and chicken, all cooked on a wood-fired grill. Locals-only feel.", tip:"Open for dinner only. The pork ribs are outstanding. Cash preferred.", rating:"4.9", lat:36.896365, lng:27.283392 },
    { id:"r4", hours:"11:00-00:00",  name:"Noah's Ark", cat:"restaurants", phone:"+30 22421 16294", website:"", social:"https://www.instagram.com/noahs_ark_kos/",  desc:"The best restaurant in Kos according to many visitors. Armenian and Greek cuisine at the highest level. Unique, creative menu that stands out from every other spot on the island.", tip:"Try the Armenian specialities, you won't find them anywhere else on the island.", rating:"4.9", lat:36.895833, lng:27.28449 },
    
    
    { id:"r7", hours:"18:00–23:30",  name:"Meze & Wine Kyriakos", cat:"restaurants", phone:"+30 22420 24695", website:"", social:"",  desc:"Specialises in traditional Greek meze dishes paired with a carefully chosen Greek wine list. Intimate, relaxed and genuinely delicious.", tip:"Order the full meze spread to share, it's the best way to experience the menu.", rating:"4.8", lat:36.899247, lng:27.283808 },
    { id:"r8", hours:"11:30-23:30",  name:"Kapari Meze Restaurant", cat:"restaurants", phone:"+30 22420 25220", website:"", social:"https://www.instagram.com/kaparimeze/",  desc:"Charming meze restaurant in Kos Town with a strong reputation for fresh, authentic Greek food. Great selection of small plates and local wines.", tip:"The grilled halloumi and the tzatziki here are the best on the island.", rating:"4.7", lat:36.891316, lng:27.285616 },
    { id:"r9", hours:"11:00-01:00",  name:"Elia Restaurant", cat:"restaurants", phone:"+30 22420 22133", website:"https://elia-kos.gr", social:"",  desc:"Set in a beautifully restored 1890 building in the Old Town. Serves traditional recipes from across Greece alongside ouzo and tsipouro.", tip:"A hidden gem on Apellou Street. The atmosphere inside is wonderful in the evening.", rating:"4.8", lat:36.891591, lng:27.286347 },
    
    { id:"r11", hours:"12:00-22:00", name:"Ampavri Taverna", cat:"restaurants", desc:"A typical, cosy Greek taverna just outside Kos Town in the Ampavris area. Excellent food at low prices and famously warm hospitality from owner Yorgos.", tip:"A true locals' favourite. Very affordable and completely unpretentious.", phone:"+30 22420 26656", rating:"4.7", lat:36.889759, lng:27.293487 },
    
    
    { id:"r14", hours:"16:00-23:00", name:"Stavlisio Steak House", cat:"restaurants", desc:"The top steakhouse on Kos, premium cuts, perfectly cooked. A carnivore's paradise with an impressive wine cellar to match.", tip:"Go for the ribeye. Bookings essential in summer.", phone:"+30 22420 21535", website:"https://www.vanart.gr/stavlisio/", social:"https://www.instagram.com/stavlisiosteakhouse/", rating:"4.8", lat:36.901452, lng:27.283926 },
    { id:"r15", hours:"11:00-00:00", name:"Blue Note Restaurant", cat:"restaurants", desc:"Combines traditional Greek recipes with an innovative modern touch. Live music on some evenings adds a wonderful atmosphere to an already great dining experience.", tip:"Ask about live music nights when booking, well worth timing your visit around.", phone:"+30 22420 92179", website:"https://bluenoterestaurant.gr/", rating:"4.7", lat:36.78265, lng:27.144734 },
    
    
    
    { id:"r19", hours:"11:00–23:00", name:"Kardamena Harbour Tavernas", cat:"restaurants", desc:"A cluster of traditional fish tavernas around Kardamena harbour. Catch of the day grilled simply with lemon and olive oil, the quintessential Greek island meal.", tip:"Walk the harbour and look at the fresh fish on display before choosing which taverna.", rating:"4.5", lat:36.7850, lng:27.1350 },
    
    { id:"r23", hours:"12:00-22:00", name:"Plori", phone:"+30 22420 69686", website:"", social:"https://www.instagram.com/taverna_plori_kos", cat:"restaurants", desc:"A lovely restaurant in Tigaki, right in the heart of one of the island's most popular beach resorts. Plori serves fresh Greek food with a relaxed beachside atmosphere, great for a long lazy lunch after the beach or a warm evening meal.", tip:"Tigaki is a short ride from Kos Town and Plori is one of the best spots to eat there. Try the grilled fish and the local mezedes.", rating:"4.7", lat:36.889056, lng:27.182066 },
    { id:"r22", hours:"13:00-23:00", name:"Votsalakia", phone:"+30 22420 26555", website:"", social:"https://www.instagram.com/ta_votsalakia/", cat:"restaurants", desc:"A charming restaurant named after the pebbles that line the nearby shore. Fresh, honest Greek cooking in a relaxed setting, popular with locals and tourists who know where to look. Great fish and traditional dishes cooked with care.", tip:"Ask for the daily fish special, it is always worth ordering. A genuinely local atmosphere that is hard to find in the busier parts of the island.", rating:"4.7", lat:36.898137, lng:27.286887 },
    { id:"r21", hours:"11:00-23:00 (Sun closed)", name:"Fish House", phone:"+30 22420 21725", website:"", social:"https://www.instagram.com/fish_house_taverna", cat:"restaurants", featured:true, desc:"One of the finest seafood restaurants on Kos, fresh catch of the day, expertly prepared with a beautiful setting. A true local gem.", tip:"Ask for the daily catch, it came off the boat this morning. You will not eat fresher fish anywhere on the island.", rating:"5.0", lat:36.894107, lng:27.28738 },
    { id:"r24", hours:"10:00-22:00", name:"Sunset Balcony 1981", phone:"+30 22420 69120", website:"", social:"https://www.facebook.com/SunsetBalconyTaverna/", cat:"restaurants", desc:"A wonderful taverna perched up in the hills with one of the most breathtaking sunset views on the island. Honest Greek food served with warmth and hospitality in a setting that makes every meal feel special. The kind of place you stumble upon and never forget.", tip:"Time your visit for the sunset and you will not be disappointed. The drive up is part of the experience.", rating:"4.4", lat:36.844955, lng:27.204022 },
    { id:"r25", hours:"10:00-21:00", name:"Agios Theologos Restaurant", phone:"+30 6974503556", website:"", social:"https://www.facebook.com/profile.php?id=100063642994925", cat:"restaurants", desc:"A remote and utterly authentic taverna at the far southwestern tip of Kos, right on the rocky shore above the sea. One of the most characterful dining spots on the island. The fish comes off the boat the same morning and the setting is unlike anything else on Kos.", tip:"The drive out here is half the adventure. Completely worth it. Call ahead to check they are open.", rating:"4.9", lat:36.713852, lng:26.922159 },
    { id:"r26", hours:"09:30-22:00", name:"Taverna Asfendiou", phone:"+30 22420 67388", website:"", social:"", cat:"restaurants", desc:"A wonderful traditional taverna nestled in the beautiful mountain village of Asfendiou on the slopes of Mount Dikeos. Home-cooked Greek food made with local ingredients, served in a peaceful garden setting away from the tourist crowds. Exactly what a Greek island taverna should be.", tip:"Go for lunch on a weekday when it is quietest. The village itself is beautiful so leave time to walk around before or after eating.", rating:"4.7", lat:36.852278, lng:27.207802 },
    { id:"r27", hours:"09:00-00:00", name:"Kali Kardia", phone:"+30 22420 59289", website:"", social:"", cat:"restaurants", desc:"A welcoming, unpretentious taverna with a name that means Good Heart in Greek and a reputation that lives up to it. Popular with locals from the Mastichari area for its generous portions, fresh ingredients and warm family atmosphere. A reliable and honest choice.", tip:"Order the daily specials, always freshly made and great value. A favourite with the locals so that is always a good sign.", rating:"4.3", lat:36.850284, lng:27.075829 },
    { id:"r28", hours:"09:00-21:00", name:"Oria Taverna Palio Pyli", phone:"+30 6974408843", website:"", social:"https://www.facebook.com/oriatavern/", cat:"restaurants", desc:"A charming rustic taverna near the medieval ghost village of Old Pyli, set amid olive trees and stone ruins. Traditional Greek food made with love in one of the most atmospheric locations on the island. Combine your visit with a walk up to the abandoned Byzantine castle above.", tip:"Pair lunch here with a visit to Old Pyli just above the taverna. A magical combination that most tourists never discover.", rating:"4.8", lat:36.836639, lng:27.187834 },
    { id:"r29", name:"Taverna Nestoras", phone:"", website:"", social:"", cat:"restaurants", desc:"A warm and welcoming traditional taverna with a loyal following among locals and returning tourists alike. Classic Greek home cooking, generous portions and the kind of genuine hospitality that makes you feel like a regular from the moment you walk in.", tip:"Ask what is cooking that day and go with the daily specials. The kind of honest Greek food that is getting harder to find.", rating:"4.7", lat:36.8940, lng:27.2880, hours:"" },
    { id:"r30", name:"Lofaki", phone:"", website:"", social:"", cat:"restaurants", desc:"A charming restaurant perched with beautiful views over the island. Lofaki offers a relaxed atmosphere, fresh ingredients and a menu that celebrates the best of Greek island cuisine. A favourite with those who know where to look.", tip:"Go for the view as much as the food. Best at golden hour when the light over the island is extraordinary.", rating:"4.7", lat:36.8920, lng:27.2860, hours:"" },
    { id:"r31", name:"Gelateria Carino", phone:"", website:"", social:"", cat:"restaurants", desc:"The best ice cream on the island, full stop. Gelateria Carino makes fresh artisan gelato daily using quality ingredients. After a day at the beach or an evening stroll through Kos Town, this is the essential stop.", tip:"The pistachio and the Greek honey flavours are exceptional. Try a combination cup rather than choosing just one.", rating:"4.8", lat:36.8935, lng:27.2878, hours:"" },
    { id:"r32", name:"Mummy's Cooking", phone:"", website:"", social:"", cat:"restaurants", desc:"Eudokia's legendary kitchen — this is what real Greek home cooking tastes like. Mummy's Cooking is exactly what it sounds like: proper, heartfelt food made the way it has always been made, with love and local ingredients. Absolutely unmissable.", tip:"Go hungry and try a bit of everything. This is the kind of meal you will still be talking about when you get home.", rating:"4.9", lat:36.8930, lng:27.2870, hours:"" },
    { id:"r33", name:"Sourasis", phone:"", website:"", social:"", cat:"restaurants", desc:"A respected local restaurant known for its fresh seafood and honest Greek cooking. Sourasis has built a strong reputation among locals and in-the-know visitors who come back every year. Simple, excellent food in a genuine atmosphere.", tip:"Fresh fish daily. Ask what came in that morning and trust the recommendation of the staff.", rating:"4.7", lat:36.8925, lng:27.2875, hours:"" },
    { id:"r34", name:"Sardelles", phone:"", website:"", social:"", cat:"restaurants", desc:"Named after the humble sardine, this restaurant celebrates the best of Greek seafood in a relaxed and unpretentious setting. Sardelles is a local gem that delivers consistently excellent fish dishes at fair prices.", tip:"The grilled sardines and the octopus are the stars of the menu. Pair with cold local wine and you have a perfect Kos evening.", rating:"4.7", lat:36.8918, lng:27.2868, hours:"" },
    { id:"r35", name:"Nick The Fisherman", phone:"", website:"", social:"", cat:"restaurants", desc:"A classic Kos fishing taverna with a direct line to the sea. Nick The Fisherman serves whatever the boats bring in each day, simply and perfectly cooked. The freshness speaks for itself in every dish.", tip:"Always ask for the catch of the day. If Nick recommends something, order it. No fuss, just outstanding fresh fish.", rating:"4.8", lat:36.8950, lng:27.2930, hours:"" },
    { id:"r36", name:"Restaurant Limnionas", phone:"", website:"", social:"", cat:"restaurants", desc:"Set right on the hidden cove of Limnionas on the southwest coast, this restaurant has one of the most spectacular settings on the entire island. Crystal clear water on three sides, fresh fish from the cove and a completely different side of Kos from the tourist strip.", tip:"The drive out here is part of the adventure. Combine with a swim in the cove and make a full afternoon of it. Completely worth the journey.", rating:"4.8", lat:36.773814, lng:26.962655, hours:"" },
    { id:"r37", name:"Mylotopi", phone:"", website:"", social:"", cat:"restaurants", desc:"A beautiful restaurant set in a converted windmill area, offering a unique dining experience with traditional Greek food and a stunning setting. Mylotopi is one of those places that is as much about the atmosphere as it is about the food.", tip:"Go at sunset when the light catches the old stone walls. A romantic and utterly memorable dinner setting.", rating:"4.8", lat:36.8928, lng:27.2872, hours:"" },
    { id:"r38", name:"Lemoni", phone:"", website:"", social:"", cat:"restaurants", desc:"Fresh, bright and full of Mediterranean flavour, Lemoni lives up to its name with a menu that celebrates the clean tastes of the Greek islands. A lovely choice for a relaxed lunch or a light evening meal in a welcoming atmosphere.", tip:"The lemon-based dishes are obviously a highlight. Fresh, zingy and perfect for a warm day on the island.", rating:"4.7", lat:36.8922, lng:27.2862, hours:"" },
    { id:"r39", name:"Taverna Tsambala", phone:"", website:"", social:"", cat:"restaurants", desc:"A traditional village taverna with real character and soul. Taverna Tsambala is the kind of place that has been feeding locals and their families for generations, serving honest Greek food in a warm and unpretentious setting away from the tourist areas.", tip:"This is local Kos at its most authentic. Come with time, order slowly and enjoy the atmosphere.", rating:"4.7", lat:36.8910, lng:27.2858, hours:"" },
  ],
  bars: [
    { id:"v1", hours:"21:00–05:00",  name:"Bar Street (Nafklirou)", phone:"", website:"", social:"",  emoji:"🍹", cat:"bars", desc:"The legendary epicentre of Kos nightlife, stretching from Plane Tree Square to Liberty Square. Transforms after midnight into a vibrant party zone with thousands of young Europeans.", tip:"Start at the quieter end near the square around 10pm, then follow the energy toward the harbour.", rating:"4.5", lat:36.8912, lng:27.2872 },
        { id:"v4", hours:"20:00–04:00",  name:"Mylos Beach Bar", phone:"+30 22420 24048", website:"https://mylos-kos.gr", social:"https://www.instagram.com/mylos_kos",  emoji:"⚙️", cat:"bars", desc:"Upscale club set in a converted windmill right on the beach. More sophisticated vibe than Bar Street, with quality cocktails and resident DJs.", tip:"Hosts the biggest monthly beach party on the island with famous DJs. Check their schedule.", rating:"4.7", lat:36.9018, lng:27.2978 },
                { id:"v8", hours:"21:00–04:00",  name:"Charisma Bar", emoji:"✨", cat:"bars", desc:"Popular Bar Street favourite known for themed nights, DJ sets and a reliably fun party atmosphere. Friendly staff and great drinks specials.", tip:"Check their Instagram for themed night schedules as some nights are legendary.", rating:"4.5", lat:36.891, lng:27.287 },
        { id:"v10", hours:"18:00–02:00", name:"Harbour Cocktail Bars", emoji:"⛵", cat:"bars", desc:"A stretch of elegant harbour-side bars along the Kos Town waterfront. Relaxed, sophisticated and perfect for those who want ambience over party chaos.", tip:"Great alternative to Bar Street if you want a quieter drink with a beautiful setting.", rating:"4.6", lat:36.8958, lng:27.2938 },
    { id:"v11", hours:"09:00–02:00", name:"Alibaba Beach Bar", emoji:"🏖️", cat:"bars", desc:"Hugely popular beach bar beloved by locals and tourists alike. Genuine hospitality, great music and a proper beach party atmosphere.", tip:"If you use the food and drinks from the bar you can use the sunbeds for free!", rating:"4.7", lat:36.9012, lng:27.2965 },
        { id:"v13", hours:"10:00–02:00", name:"Ammos Beach Cocktail Bar", phone:"+30 22420 25066", website:"", social:"https://www.instagram.com/ammos_kos",  emoji:"🍸", cat:"bars", desc:"Award-winning beach cocktail bar with an impressive menu of creative drinks. Beautiful sea views and a stylish relaxed atmosphere.", tip:"Their signature cocktail list is outstanding, ask the bartender for their recommendation.", rating:"4.8", lat:36.8742, lng:27.3312 },
    { id:"v14", hours:"21:00–04:00", name:"Kardamena Bar Strip", emoji:"🎉", cat:"bars", desc:"Kardamena is the second major nightlife destination on the island. A concentrated strip of bars and clubs with an energetic, international crowd.", tip:"Kardamena nightlife is more relaxed than Kos Town but still very lively. Great for groups.", rating:"4.3", lat:36.7804, lng:27.142 },
        { id:"v16", hours:"10:00–02:00", name:"Mastichari Beach Bars", emoji:"🐚", cat:"bars", desc:"Cluster of relaxed beach bars in Mastichari with a more local, laid-back feel than the party bars of Kos Town. Great sunset drinks.", tip:"Less touristy than the main resort bars. Great for an authentic local evening out.", rating:"4.5", lat:36.8502, lng:27.0762 },
                    { id:"v21", hours:"22:00–05:00", name:"Zero", phone:"", website:"", social:"",  emoji:"🎧", cat:"bars", desc:"Kos Town's coolest underground bar, intimate, stylish and with a seriously good sound system. A favourite with those in the know for craft cocktails and late-night vibes.", tip:"Gets going late and the real crowd arrives after midnight. One of the best kept secrets in Kos nightlife.", rating:"4.8", lat:36.8915, lng:27.2878 },
    { id:"v22", hours:"18:00–02:00", name:"Omega Sky Bar", phone:"", website:"", social:"",  emoji:"🌌", cat:"bars", desc:"Spectacular rooftop bar with sweeping 360-degree views over Kos Town, the harbour and the Aegean. Premium cocktails served with one of the most dramatic backdrops on the island.", tip:"Book a table for sunset as the view when the sun drops behind the Turkish mountains is absolutely stunning.", rating:"4.9", lat:36.8938, lng:27.2882 },
    { id:"v23", hours:"18:00–02:00", name:"Thea Rooftop Bar", phone:"", website:"", social:"",  emoji:"🌹", cat:"bars", desc:"Sophisticated and elegant rooftop bar with a romantic atmosphere, beautiful lighting and expertly crafted cocktails. One of the most refined bars on the island.", tip:"Perfect for a special evening or date night. The cocktail menu is creative and the views are gorgeous.", rating:"4.9", lat:36.8945, lng:27.2895 },
    { id:"v24", hours:"18:00–03:00", name:"Kaseta", phone:"", website:"", social:"", emoji:"⚓", cat:"bars", desc:"A beloved bar right on the harbour of Kos Town and one of the most characterful spots on the waterfront. Great atmosphere, cold drinks and one of the best spots on the island to watch the boats come and go as the evening unfolds.", tip:"Grab a seat facing the harbour as the sun goes down. The harbour lighting at night makes this one of the most atmospheric bars in Kos Town.", rating:"4.7", lat:36.893, lng:27.2868 },
    { id:"v25", hours:"20:00–03:00", name:"Scholargio", phone:"", website:"", social:"", emoji:"🎓", cat:"bars", desc:"A well-loved Kos Town bar with a loyal following among both locals and tourists. Great drinks, a relaxed vibe and the kind of place you end up staying far longer than you planned.", tip:"A great spot to start the evening, friendly crowd and good music without the intensity of Bar Street.", rating:"4.6", lat:36.8908, lng:27.2862 },
        { id:"v28", hours:"20:00–04:00", name:"Sitar", phone:"", website:"", social:"", emoji:"🎸", cat:"bars", desc:"Sitar is a well-known bar in Kos Town with character and charm. A great place to start or continue the evening, with good drinks, a warm atmosphere and the kind of easy-going vibe that makes you stay longer than you planned.", tip:"One of those bars that always has a good crowd without feeling overwhelming. Great for groups and easy to find in the heart of Kos Town.", rating:"4.6", lat:36.8955, lng:27.2932 },
    { id:"v26", hours:"19:00–03:00", name:"Kentriko", phone:"", website:"", social:"", emoji:"🏛️", cat:"bars", desc:"A classic Kos Town bar right in the heart of the action. Kentriko (meaning Central) lives up to its name as a central meeting point for locals and tourists alike. Great atmosphere, good drinks and that unmistakable buzz of a bar that has been a firm favourite for years.", tip:"One of the most central bars in Kos Town, perfect for people watching and starting the evening. Always a friendly crowd.", rating:"4.6", lat:36.8932, lng:27.2878 },
    { id:"v29", hours:"", name:"C Food & Mood", phone:"", website:"", social:"", emoji:"", cat:"bars", desc:"A stylish and relaxed spot that blends good food with a great bar atmosphere. C Food & Mood has built a loyal following for its quality drinks, creative menu and the kind of easy-going vibe that keeps people coming back throughout the summer.", tip:"Great for both a casual meal and drinks. The atmosphere shifts nicely from afternoon into evening.", rating:"4.7", lat:36.892, lng:27.2865 },
    { id:"v30", hours:"", name:"Kapu Cycling Bar", phone:"", website:"", social:"", emoji:"", cat:"bars", desc:"A unique concept on Kos — a bar with a cycling theme that attracts an active, sociable crowd. Kapu Cycling Bar is a refreshingly different addition to the Kos Town bar scene, with good drinks and a personality all of its own.", tip:"A great conversation starter. Even if you didn't cycle there, the atmosphere makes it worth the visit.", rating:"4.6", lat:36.8922, lng:27.2871 },
    { id:"v31", hours:"", name:"Kaza Cafe Bar", phone:"", website:"", social:"", emoji:"", cat:"bars", desc:"A charming cafe bar with a warm and welcoming atmosphere, perfect for everything from a morning coffee to an evening cocktail. Kaza has that rare quality of feeling comfortable at any time of day, making it a reliable and much-loved spot in Kos Town.", tip:"Good for all hours — coffee in the morning, cold drinks in the afternoon and cocktails at night.", rating:"4.7", lat:36.8928, lng:27.2875 },
        { id:"v33", hours:"", name:"To Kafenio", phone:"", website:"", social:"", emoji:"", cat:"bars", desc:"A proper traditional Greek kafeneio — the kind of place where locals have been drinking coffee and debating everything since long before tourism arrived on Kos. To Kafenio is an authentic slice of Greek island life that tourists rarely discover.", tip:"Order a Greek coffee and sit. Do not rush. This is the real Kos.", rating:"4.7", lat:36.8918, lng:27.286 },
  ],
    { id:"ac20", hours:"10:00-18:00", name:"Lido Waterpark", emoji:"💦", cat:"activities", phone:"", website:"https://lidowaterpark.gr", social:"", desc:"One of the largest waterparks in Greece with slides, wave pools and lazy rivers. A fantastic day out for families and groups.", tip:"Buy tickets online for a discount. Go on a weekday to avoid peak weekend crowds.", rating:"4.5", lat:36.8650, lng:27.1800 },
  sights: [
    { id:"s1",  name:"Asklepion", emoji:"🏛️", cat:"sights", desc:"The most significant archaeological site on Kos. Ancient healing sanctuary and medical school of Hippocrates, one of the most renowned in the ancient world. Three terraced levels with stunning sea views.", tip:"Hire a local guide to bring the history to life. Take bus Line 5 from Kos Town.", rating:"4.9", lat:36.8700, lng:27.2500 },
    { id:"s2",  name:"Castle of the Knights", emoji:"🏰", cat:"sights", desc:"Imposing 15th-century fortress built by the Knights of St John, dominating the harbour entrance. One of the best-preserved medieval castles in the Aegean.", tip:"Visit late afternoon when the golden light hits the stone walls beautifully. Entry fee is small.", rating:"4.8", lat:36.8960, lng:27.2930 },
    { id:"s3",  name:"Plane Tree of Hippocrates", emoji:"🌳", cat:"sights", desc:"One of the oldest and largest plane trees in Europe, said to be where Hippocrates himself taught medicine 2,400 years ago. Sits in the central square of Kos Town.", tip:"Free to visit. Great for photos. Combine with a coffee at one of the surrounding cafes.", rating:"4.6", lat:36.8945, lng:27.2875 },
    { id:"s4",  name:"Zia Village", emoji:"⛪", cat:"sights", desc:"The most charming mountain village on Kos, perched on the slopes of Mount Dikeos. Traditional craft shops, tavernas and the island's most spectacular sunset panorama.", tip:"Arrive 30 minutes before sunset, the view over the island and to Turkey is unforgettable.", rating:"4.9", lat:36.8300, lng:27.1800 },
    { id:"s5",  name:"Ancient Agora", emoji:"🏺", cat:"sights", desc:"Sprawling ancient marketplace in the heart of Kos Town, the former civic and commercial hub of ancient Kos. Wander among temples, stoas and market hall remnants.", tip:"Free and always open. Combine with a walk through the Old Town immediately adjacent.", rating:"4.7", lat:36.8942, lng:27.2888 },
    { id:"s6",  name:"Antimachia Castle", emoji:"🗼", cat:"sights", desc:"Dramatic medieval castle near Antimachia village, built by the Knights of St John. Less visited than the harbour castle but arguably more atmospheric, perched on a windswept hill.", tip:"Largely unrestored and rarely crowded. A rewarding detour if you have a car.", rating:"4.7", lat:36.8050, lng:27.0750 },
    { id:"s7",  name:"Old Pyli (Ghost Village)", emoji:"👻", cat:"sights", desc:"Haunting abandoned Byzantine village clinging to the hillside above modern Pyli. Deserted in the 1800s, it retains churches, houses and castle ruins reclaimed by nature.", tip:"Combine with lunch at the Palia Pyli Taverna below. A genuinely eerie and beautiful place.", rating:"4.8", lat:36.8380, lng:27.1580 },
    { id:"s8",  name:"Roman Odeon", emoji:"🎭", cat:"sights", desc:"Remarkably well-preserved ancient theatre near the Agora that once hosted performances and public gatherings. The marble seating and stage give a vivid sense of Roman daily life.", tip:"Performances are still occasionally held here in summer. Check local listings.", rating:"4.6", lat:36.8938, lng:27.2885 },
    { id:"s9",  name:"Archaeological Museum", emoji:"🏺", cat:"sights", desc:"Housed in a handsome Italian-era building in Eleftherias Square. Superb collection of statues, mosaics and artefacts from the island's ancient sites.", tip:"Don't miss the famous mosaic of Hippocrates welcoming Asclepius to Kos. Excellent value.", rating:"4.7", lat:36.8948, lng:27.2878 },
    { id:"s10", name:"Eleftherias Square", emoji:"☕", cat:"sights", desc:"The lively central square of Kos Town, ringed by cafes, the Archaeological Museum, the Defterdar Mosque and the covered market. The beating heart of daily life in Kos.", tip:"Grab a Greek coffee here and watch island life go by. The best people-watching spot in Kos.", rating:"4.5", lat:36.8948, lng:27.2878 },
    { id:"s11", name:"Defterdar Mosque", emoji:"🕌", cat:"sights", desc:"Ottoman-era mosque in the central square, a reminder of the island's Turkish period. One of the most intact Ottoman buildings in the Dodecanese.", tip:"Reflects the fascinating multi-cultural history of Kos. Photograph from the square.", rating:"4.5", lat:36.8950, lng:27.2880 },
    { id:"s12", name:"Casa Romana", emoji:"🏛️", cat:"sights", desc:"Beautifully restored Roman villa with stunning floor mosaics, frescoed walls and a central atrium. One of the finest Roman domestic interiors in Greece.", tip:"Often overlooked by tourists and rarely crowded. The mosaics are extraordinary.", rating:"4.8", lat:36.8930, lng:27.2870 },
    { id:"s13", name:"Plaka Forest & Peacocks", emoji:"🦚", cat:"sights", desc:"A magical pine forest near Plaka village that is home to a wild population of peacocks roaming completely freely. Surreal and wonderful and unique in all of Greece.", tip:"Go in the morning when the peacocks are most active. Completely free and unlike anywhere else.", rating:"4.8", lat:36.8150, lng:27.0350 },
        { id:"s15", name:"Mount Dikeos", emoji:"⛰️", cat:"sights", desc:"The highest peak on Kos at 846 metres, rising dramatically above the island. The views from the summit take in the whole of the Dodecanese and the coast of Turkey.", tip:"Best hiked early morning. Bring plenty of water and sturdy footwear.", rating:"4.7", lat:36.8200, lng:27.1650 },
    { id:"s16", name:"Hippocrates Garden", emoji:"🌺", cat:"sights", desc:"Cultural centre and botanical garden dedicated to Hippocrates and the history of medicine. Beautiful green space with medicinal herb gardens and exhibitions.", tip:"A peaceful escape from the tourist bustle. Great for kids interested in science and history.", rating:"4.5", lat:36.8920, lng:27.2840 },
    { id:"s17", name:"Therma Hot Springs", emoji:"♨️", cat:"sights", desc:"Natural thermal springs where hot volcanic water flows directly into the sea, creating warm bathing pools on the rocky shore. A unique geological wonder.", tip:"Most atmospheric at sunrise. Wear old swimwear, the minerals can stain.", rating:"4.7", lat:36.8333, lng:27.3500 },
    { id:"s18", name:"Antimachia Traditional House", emoji:"🏠", cat:"sights", desc:"Preserved traditional Dodecanese house in Antimachia village, maintained as a living museum showing domestic life as it was a century ago.", tip:"A fascinating glimpse into authentic island life. The volunteer guides are passionate and knowledgeable.", rating:"4.6", lat:36.8100, lng:27.0800 },
    { id:"s19", name:"Kardamena Old Village", emoji:"🎨", cat:"sights", desc:"Behind the modern tourist resort lies the original fishing village of Kardamena with whitewashed streets, a Byzantine church and a genuinely local atmosphere.", tip:"Walk 10 minutes from the main strip to find the real village. A world away from the beach bars.", rating:"4.4", lat:36.7850, lng:27.1280 },
    { id:"s20", name:"Kefalos Windmills", emoji:"🌬️", cat:"sights", desc:"A row of traditional stone windmills on the Kefalos headland, silhouetted dramatically against the Aegean sky. One of the most iconic images of Kos.", tip:"Best photographed at golden hour. Combine with a swim at Agios Stefanos beach directly below.", rating:"4.7", lat:36.7450, lng:27.2750 },
  ],
  villages: [
    { id:"vil1", name:"Kos Town", emoji:"🏙️", cat:"villages", desc:"The vibrant capital and main port of the island, a fascinating blend of ancient Greek ruins, Ottoman mosques, Venetian architecture and modern Greek life. Home to the Castle of the Knights, the Ancient Agora, the Plane Tree of Hippocrates and the island's best restaurants and nightlife. Lively, cosmopolitan and endlessly interesting to explore on foot.", tip:"Get up early and explore the archaeological sites before the heat and crowds arrive. The old town streets around Apellou are magical in the morning.", rating:"4.8", lat:36.8940, lng:27.2880 },
    { id:"vil2", name:"Zia", emoji:"⛰️", cat:"villages", desc:"The most famous and most visited village on Kos, a picturesque mountain settlement on the slopes of Mount Dikeos surrounded by pines and olive trees. Famous above all for its extraordinary panoramic sunsets, craft shops selling local honey and ceramics, and traditional tavernas. The view from Zia over the whole island and across to Turkey is one of the great sights of the Dodecanese.", tip:"Arrive 30 minutes before sunset and book a taverna table facing west. Visit in the morning to explore quietly before the tour buses arrive.", rating:"4.9", lat:36.8300, lng:27.1800 },
    { id:"vil3", name:"Kardamena", emoji:"🎉", cat:"villages", desc:"Once a small fishing village, Kardamena has grown into the island's second-biggest resort and its unofficial nightlife capital. The beach is long and sandy, the bar strip is lively, and the harbour is charming. Beneath the tourism, Kardamena has ancient roots, numerous temples and early Christian churches have been unearthed here. Daily boats depart from the port to Nisyros island.", tip:"The old part of the village behind the main strip is worth exploring, whitewashed streets, a Byzantine church and a genuinely local atmosphere away from the bars.", rating:"4.3", lat:36.7833, lng:27.1333 },
    { id:"vil4", name:"Kefalos", emoji:"🌅", cat:"villages", desc:"The ancient capital of Kos, known in antiquity as Astypalaia, Kefalos sits on a dramatic headland at the far southwest of the island with sweeping views over the Aegean. A quiet, traditional village of whitewashed houses, narrow cobblestone alleys, old windmills and a ruined hilltop castle. The surrounding area has some of the island's most beautiful and least crowded beaches.", tip:"Kefalos is the place to escape the summer crowds. Hire a scooter and explore the beaches and coves on the peninsula below, most tourists never make it this far.", rating:"4.8", lat:36.7380, lng:26.9980 },
    { id:"vil5", name:"Antimachia", emoji:"🏰", cat:"villages", desc:"A large, dignified village at the crossroads of the island, close to the airport and the island's most impressive Venetian castle. Antimachia is authentically Greek and largely untouched by tourism. The castle of the Knights of St John looms over the village, and the traditional Antimachia House museum offers a beautifully preserved glimpse into island life of the past.", tip:"Visit in May for the spectacular Medieval Festival at the castle, one of the best events on the island. The traditional house museum is free and genuinely fascinating.", rating:"4.6", lat:36.8100, lng:27.0800 },
    { id:"vil6", name:"Mastichari", emoji:"⚓", cat:"villages", desc:"A charming coastal village and fishing port on the north coast with a beautiful white-sand beach that genuinely resembles the Caribbean. Mastichari is the departure point for ferries to Kalymnos and Pserimos, and its waterfront is lined with excellent fish tavernas serving the daily catch. Less developed than Tigaki or Kardamena, it retains a genuinely local feel.", tip:"The fish tavernas along the harbour are among the best value on the island. Try the grilled octopus hanging in the sun outside, that is a good sign of freshness.", rating:"4.6", lat:36.8465, lng:27.0068 },
    { id:"vil7", name:"Pyli", emoji:"💧", cat:"villages", desc:"A picturesque inland village in the heart of the island, surrounded by lush olive groves and famous for its fresh water springs. The cobbled village square, colourful traditional houses and stone-built tavernas make it one of the most charming authentic spots on Kos. Just outside is Old Pyli, the haunting abandoned Byzantine ghost village and castle, known as the Dodecanese Mystras.", tip:"Combine a visit to the village with a walk up to Old Pyli above it. The abandoned castle with its 14th century frescoes is extraordinary, very few tourists find it.", rating:"4.7", lat:36.8380, lng:27.1580 },
    { id:"vil8", name:"Platani", emoji:"🕌", cat:"villages", desc:"A unique and fascinating village just 3km from Kos Town on the road to the Asklepion, home to the island's Muslim community, the descendants of Ottoman settlers who remained after the end of Turkish rule. Platani is entirely different in character from any other Kos village, with mosques, Turkish coffee houses and tavernas serving outstanding kebabs, mezes and Oriental dishes.", tip:"Stop here for lunch on the way to or from the Asklepion. The Turkish-style mezedes and kebabs are extraordinary and completely unlike anything else on the island.", rating:"4.7", lat:36.8770, lng:27.2550 },
    { id:"vil9", name:"Asfendiou", emoji:"🌿", cat:"villages", desc:"One of the most beautiful traditional villages on Kos, tucked into the wooded northern slopes of Mount Dikeos. Asfendiou is actually a cluster of small hamlets, Zia, Asomatos, Evangelistra and Lagoudi, each with its own character. The two-storey stone mansions known as pirgi give the village a fortress-like grandeur, and the 11th century church of Asomaton Taxiarchon is a remarkable sight.", tip:"A wonderful area for walking and trekking in the hills. Much cooler than the coast in summer. The village is best visited in the morning before the Zia crowds arrive.", rating:"4.7", lat:36.8200, lng:27.1650 },
    { id:"vil10", name:"Tigaki", emoji:"🦩", cat:"villages", desc:"A popular beach resort village on the north coast with one of the best sandy beaches on the island, 10km of fine sand and shallow water ideal for families. Beyond the beach, Tigaki has a local character that many resorts lack, and the nearby Alikes wetland is a protected nature reserve and a haven for flamingos, herons and other wading birds.", tip:"Walk east from the beach to the Alikes salt lake at dusk, flamingos feed here regularly and it is one of the most unexpected wildlife experiences on the island.", rating:"4.5", lat:36.8655, lng:27.0685 },
    { id:"vil11", name:"Marmari", emoji:"🏄", cat:"villages", desc:"A relaxed beach resort village on the north coast known for its wide sandy beach and its near-constant winds, making it one of the best windsurfing and kitesurfing spots in the Dodecanese. Marmari has a low-key, unpretentious character with good tavernas, accommodation and a pleasant local atmosphere.", tip:"If you windsurf or kitesurf, Marmari should be your base on Kos. Several professional schools and rental centres operate here throughout the summer.", rating:"4.4", lat:36.8600, lng:27.0300 },
    { id:"vil12", name:"Zipari", emoji:"🌾", cat:"villages", desc:"A quiet, traditional inland village a few kilometres from Kos Town, largely untouched by tourism. Zipari sits amid fertile farmland and olive groves and gives an authentic glimpse of rural Kos life. It's a useful base for exploring the interior of the island and is close to several walking routes up into the Dikeos mountains.", tip:"Drive or cycle through Zipari on the way to the mountain villages, it is a good place to stop for a genuine local coffee and watch daily island life.", rating:"4.3", lat:36.8600, lng:27.2200 },
  ],
  activities: [
    { id:"ac1",  name:"Dream Catch Kos", emoji:"🎣", cat:"activities", featured:true, phone:"+30 6974170207", website:"", social:"https://www.instagram.com/dreamcatch.kos", facebook:"https://www.facebook.com/share/1NePjnn1xz/", desc:"A unique land-based fishing safari run by a true local with a lifetime of knowledge of the island's secret spots. Jump in the car and head off-road to secluded beaches and hidden coves that most tourists never find, rod in hand, feet in the sand, fishing the Aegean the old-fashioned way. Small groups of one or two cars keep it personal and authentic. Suitable for complete beginners and experienced anglers alike.", tip:"This is not a boat tour, it's something far more personal and adventurous. You get driven to spots the guidebooks don't know about. Book ahead as spaces are very limited.", rating:"5.0", lat:36.8958, lng:27.2932 },
    { id:"ac2",  name:"Sailing Sunset Cruise", emoji:"⛵", cat:"activities", phone:"", website:"", social:"", desc:"Four-hour sailing cruise around the Kos coastline with swimming stops, snorkelling in crystal clear bays, fresh food and an open bar. Watching the sun set from the deck of a sailing boat with a cold drink in hand is one of those Kos moments you will never forget.", tip:"Book at the harbour ticket booths or through your hotel. A shared cruise is great value. Departs daily from Kos Town harbour, weather permitting.", rating:"4.8", lat:36.8960, lng:27.2940 },
    { id:"ac3", name:"Sea World Scuba Diving Center", emoji:"🤿", cat:"activities", featured:true, phone:"+30 690 888 1810", website:"https://scubakos.com", social:"https://www.instagram.com/seaworldscubadivingcenterkos", desc:"One of the most established and trusted scuba diving centres on Kos, based in beautiful Kefalos since 1993. PADI-certified courses from beginner to advanced, fun dives and guided trips to the most spectacular dive sites in the area. The waters around Kefalos offer outstanding visibility and rich marine life.", tip:"Whether you have never dived before or are an experienced diver, Sea World has something for you. The beginner discovery dives are excellent. Book ahead in peak season.", rating:"4.9", lat:36.7521069, lng:26.9842287 },
    { id:"ac4",  name:"Jeep Safari, Island Tour", emoji:"🚙", cat:"activities", phone:"", website:"", social:"", desc:"A full-day guided jeep safari taking you to the hidden corners of Kos that most tourists never reach, mountain villages, secret viewpoints, ancient ruins and remote beaches. The convoy format is social and fun, and the local guides know every track on the island.", tip:"One of the best ways to see the whole island in a single day. Bring sunscreen and a camera, the views from the mountain tracks are extraordinary.", rating:"4.7", lat:36.8940, lng:27.2880 },
    { id:"ac5",  name:"Cycling Tours of Kos", emoji:"🚴", cat:"activities", phone:"", website:"", social:"", desc:"Kos is famous across Greece for its cycling culture, the flat terrain and well-maintained cycle paths make it one of the best cycling islands in the country. Guided cycling tours run daily, covering the ancient sites, coastal paths and village routes. Bike rentals are widely available in Kos Town.", tip:"The cycle path from Kos Town to the Asklepion is beautiful and completely flat. Hire a bike for the day and explore at your own pace, it is the most Kos way to travel.", rating:"4.7", lat:36.8938, lng:27.2872 },
    { id:"ac6",  name:"Hippocrates Walking Tour", emoji:"🏛️", cat:"activities", phone:"", website:"", social:"", desc:"A guided walking tour of Kos Town's remarkable ancient sites led by local historians and archaeologists. Covers the Ancient Agora, Casa Romana, Roman Odeon and the Plane Tree of Hippocrates in a fascinating two-hour walk through 2,500 years of history.", tip:"Runs Tuesday and Thursday mornings from the Plane Tree of Hippocrates. Book ahead as group sizes are small. Wear comfortable shoes and bring water.", rating:"4.9", lat:36.8945, lng:27.2875 },
    { id:"ac7",  name:"Windsurfing & Kitesurfing", emoji:"🏄", cat:"activities", phone:"", website:"", social:"", desc:"Kos is one of the premier windsurfing and kitesurfing destinations in the Mediterranean, with reliable Meltemi winds on the north coast making conditions perfect throughout the summer. Several professional schools in Marmari and Mastichari offer lessons and equipment hire for all levels.", tip:"Marmari is the best spot for consistent wind. The IKO and PWA-certified schools here are world class, even complete beginners are up and riding within a day.", rating:"4.8", lat:36.8600, lng:27.0300 },
    { id:"ac8",  name:"Pirate Boat Trip", emoji:"☠️", cat:"activities", phone:"", website:"", social:"", desc:"A hugely popular full-day boat excursion for families and groups. Sail the coastline on a pirate-themed galleon, stopping at hidden bays for swimming and snorkelling. Pirate games, music, a Greek lunch and an open bar are all included. Fantastic fun and genuinely memorable.", tip:"Book a day ahead, these fill up fast in peak season. The swimming stops at the hidden bays are the highlight. Great for kids of all ages.", rating:"4.6", lat:36.8962, lng:27.2935 },
    { id:"ac9",  name:"Kayaking & Snorkelling", emoji:"🚣", cat:"activities", phone:"", website:"", social:"", desc:"Guided sea kayaking tours exploring the hidden coves and sea caves along the Kos coastline. Snorkelling equipment is included and guides point out the best spots for marine life. A peaceful, active way to explore parts of the island that are unreachable by road.", tip:"The early morning tours have calmer water and better snorkelling visibility. The sea caves near Kefalos are a particular highlight.", rating:"4.7", lat:36.8940, lng:27.2880 },
    { id:"ac10", name:"Horseback Riding", emoji:"🐴", cat:"activities", phone:"", website:"", social:"", desc:"Guided horseback riding tours through the Kos countryside, olive groves, farmland and mountain trails with views across the island. Suitable for all levels from complete beginners to experienced riders. A wonderfully different way to see the real interior of the island.", tip:"Evening rides at golden hour through the countryside are particularly beautiful. Book in advance as this is one of the more niche activities on the island.", rating:"4.6", lat:36.8600, lng:27.1800 },
    { id:"ac11", name:"Go-Karting Kos", emoji:"🏎️", cat:"activities", phone:"", website:"", social:"", desc:"One of the island's most popular adrenaline activities, a well-maintained go-kart track near Antimachia with karts for adults and children. A great option for a fun afternoon away from the beach, especially popular with families and groups.", tip:"Go in the evening when it is cooler and less busy. Arrive 30 minutes before closing for the best chance of an empty track.", rating:"4.4", lat:36.8100, lng:27.0850 },
    { id:"ac14", name:"Electric Wheels Kos", emoji:"", cat:"activities", featured:true, phone:"+30 6942984136", website:"", social:"https://www.instagram.com/electricwheels2025", facebook:"https://www.facebook.com/p/Electric-Wheels-61572289156474/", desc:"Explore Kos the fun way on a fat bike or chopper-style electric bicycle. Electric Wheels offers a fantastic fleet of e-bikes that make it easy to cover the island without breaking a sweat — perfect for the coastal path, village roads and everything in between. No licence needed, suitable for all ages.", tip:"The coastal cycle path from Kos Town toward Psalidi and Therma is stunning on an e-bike. Grab one for the day and you can cover beaches, villages and sights at your own pace with zero effort on the way back.", rating:"4.9", lat:36.908659, lng:27.279861 },
    { id:"ac13", hours:"07:00–22:00", name:"Olympian Gym", phone:"+30 22420 27012", website:"https://www.michaelkefalianos.com", social:"https://www.instagram.com/olympian.gym.kos.island", facebook:"https://www.facebook.com/Olympiangymkos", emoji:"💪", cat:"activities", desc:"A well-equipped gym in Kos Town for those who want to keep up their training while on holiday. Free weights, machines and cardio equipment all available. Run by Michael Kefalianos, it is a favourite with locals and visiting athletes who do not want to skip a session.", tip:"Day passes and weekly memberships available. A great option if you want to stay active without skipping your holiday.", rating:"4.5", lat:36.8930, lng:27.2860 },
    { id:"ac12", name:"Watersports, Paradise Beach", emoji:"💦", cat:"activities", phone:"", website:"", social:"", desc:"Paradise Beach is the undisputed watersports hub of Kos, jet skis, banana boats, parasailing, ring rides and flyboarding all operate here throughout the day. The beach operators are professional and the equipment is well-maintained. Perfect for a full adrenaline day on the water.", tip:"Prices are negotiable if you book multiple activities together. Go early morning for jet skiing, calmer water and shorter queues.", rating:"4.5", lat:36.7833, lng:27.1167 },
    { id:"ac15", name:"Hadziemmanouil Vineyards", phone:"+31 6936951939", website:"https://www.vitruviustattoo.gr/", social:"https://www.instagram.com/vitruviustattoostudio", emoji:"🍇", cat:"activities", desc:"Discover the wine-making heritage of Kos at the Hadziemmanouil family vineyard. Kos has been producing wine since antiquity and this local winery offers a genuine taste of the island's viticultural tradition. Wine tastings, tours and a connection to the land that you will not find in any resort.", tip:"A wonderful half-day excursion away from the beach. Book ahead for a guided tasting and learn the story of Koan wine.", rating:"4.8", lat:36.89045940262161, lng:27.288337513347564, hours:"10:00-19:00 (Sun closed, Sat 11:00-17:00)" },
    { id:"ac16", name:"Vitruvius Tattoo & Piercing", phone:"+31 6936951939", website:"https://www.vitruviustattoo.gr/", social:"https://www.instagram.com/vitruviustattoostudio", emoji:"🎨", cat:"activities", desc:"A professional and artistic tattoo and piercing studio on Kos, run by skilled artists who take their craft seriously. If you have been thinking about getting inked to mark your time on the island, Vitruvius is the place to do it properly.", tip:"Book an appointment in advance, especially in peak season. A holiday tattoo done well is a wonderful souvenir.", rating:"5.0", lat:36.89045940262161, lng:27.288337513347564, hours:"10:00-19:00 (Sun closed, Sat 11:00-17:00)" },
    { id:"ac17", name:"Flyboard Watersports", phone:"", website:"", social:"", emoji:"💦", cat:"activities", desc:"Experience the thrill of flyboarding on the waters of Kos — being propelled out of the sea by water jets is one of the most exhilarating watersports experiences available on the island. Suitable for beginners with trained instructors on hand throughout.", tip:"Go early in the morning when the water is calmest. First-timers are usually standing within 20 minutes — it is more achievable than it looks.", rating:"4.7", lat:36.8958, lng:27.2935, hours:"" },
    { id:"ac18", name:"Kefalos Windsurfing", phone:"", website:"", social:"", emoji:"🏄", cat:"activities", desc:"Kefalos on the southwest coast of Kos is one of the finest windsurfing locations in the Aegean, with consistent winds, warm shallow water and a relaxed local atmosphere. Professional instruction and equipment rental available for all levels from complete beginner to advanced.", tip:"The morning sessions have the most reliable wind. The shallow water here makes it much more forgiving for beginners than the north coast spots.", rating:"4.8", lat:36.746794, lng:26.974339, hours:"" },
    { id:"ac19", name:"Riptide Surf Club Kos", phone:"+30 6940660917", website:"https://riptidesurf.gr/", social:"https://www.instagram.com/riptide_surfkos", email:"riptidesurfingkos@gmail.com", emoji:"", cat:"activities", featured:false, desc:"The only surf club on Kos, based at the wild and beautiful Agios Theologos Beach near Kefalos. If you have ever wanted to ride a wave in the Aegean with a proper sunset behind you, this is the place. All levels welcome, full focus on safety, and the kind of location that makes the whole experience feel like a scene from a film.", tip:"Agios Theologos is one of the most spectacular and untouched beaches on the island. Even if you do not surf, the drive out here is worth it. Combine with a meal at the beach taverna and make a full day of it.", rating:"4.8", lat:36.71370578264965, lng:26.922150262064125, hours:"" },

// ── Opening Hours Helper ─────────────────────────────────────────────────────
function isOpenNow(hours) {
  if (!hours) return null;
  try {
    const now = new Date();
    const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    const todayShort = days[now.getDay()];
    const todayFull = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"][now.getDay()];

    // Check for closed day note e.g. "(Sun closed)" or "(monday closed)"
    const closedMatch = hours.match(/\(([^)]+?)\s+closed\)/i);
    if (closedMatch) {
      const closedStr = closedMatch[1].toLowerCase();
      if (closedStr.includes(todayShort.toLowerCase()) || closedStr.includes(todayFull)) {
        return false;
      }
    }

    // Check for open day note e.g. "Sat-Sun: 15:00-23:00"
    // Strip any parenthetical notes before parsing times
    const cleanHours = hours.replace(/\([^)]*\)/g, "").trim();

    // Handle both en dash, em dash and hyphen
    const parts = cleanHours.replace(/[–—]/g, "-").split("-");
    if (parts.length < 2) return null;
    const openStr = parts[0].trim();
    const closeStr = parts[1].trim();
    const [oh, om] = openStr.split(":").map(Number);
    const [ch, cm] = closeStr.split(":").map(Number);
    if (isNaN(oh) || isNaN(ch)) return null;
    const nowMins = now.getHours() * 60 + now.getMinutes();
    const openMins = oh * 60 + (om || 0);
    let closeMins = ch * 60 + (cm || 0);
    // Handle after-midnight closing
    if (closeMins < openMins) closeMins += 24 * 60;
    const nowAdj = nowMins < openMins ? nowMins + 24 * 60 : nowMins;
    return nowAdj >= openMins && nowAdj < closeMins;
  } catch(e) { return null; }
}

function AdminPanel({ places, onSave, onClose }) {
  const [editCat, setEditCat] = useState("beaches");
  const [editingId, setEditingId] = useState(null);
  const [localPlaces, setLocalPlaces] = useState(JSON.parse(JSON.stringify(places)));
  const [form, setForm] = useState({ name:"", emoji:"", desc:"", tip:"", rating:"4.5", lat:"", lng:"", cat:"beaches" });
  const [saved, setSaved] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(null);

  const items = localPlaces[editCat] || [];

  function startEdit(item) {
    setEditingId(item.id);
    setForm({ ...item });
  }

  function startAdd() {
    setEditingId("new");
    setForm({ name:"", emoji: CAT_EMOJIS[editCat], desc:"", tip:"", rating:"4.5", lat:"36.89", lng:"27.28", cat:editCat });
  }

  function cancelEdit() {
    setEditingId(null);
    setForm({ name:"", emoji:"", desc:"", tip:"", rating:"4.5", lat:"", lng:"", cat:editCat });
  }

  function saveItem() {
    if (!form.name.trim()) return;
    const updated = { ...localPlaces };
    if (editingId === "new") {
      const newItem = { ...form, id: "c"+Date.now(), lat:parseFloat(form.lat)||36.89, lng:parseFloat(form.lng)||27.28 };
      updated[editCat] = [...(updated[editCat]||[]), newItem];
    } else {
      updated[editCat] = updated[editCat].map(p => p.id===editingId ? { ...form, id:editingId, lat:parseFloat(form.lat)||p.lat, lng:parseFloat(form.lng)||p.lng } : p);
    }
    setLocalPlaces(updated);
    cancelEdit();
  }

  function deleteItem(id) {
    const updated = { ...localPlaces };
    updated[editCat] = updated[editCat].filter(p => p.id !== id);
    setLocalPlaces(updated);
    setConfirmDelete(null);
  }

  function handleSaveAll() {
    onSave(localPlaces);
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  }

  const inp = (field, label, placeholder, multiline) => (
    <div style={{ marginBottom:10 }}>
      <div style={{ fontSize:11, color:"#94a3b8", fontFamily:"sans-serif", textTransform:"uppercase", letterSpacing:1, marginBottom:4 }}>{label}</div>

      }
    </div>
  );

  return (
    <div style={{ position:"fixed", top:0, left:0, right:0, bottom:0, background:"#0a1628", zIndex:100, overflowY:"auto", maxWidth:430, margin:"0 auto" }}>

// ── Trip Planner ─────────────────────────────────────────────────────────────
const TRIP_DAYS = ["Day 1","Day 2","Day 3","Day 4","Day 5","Day 6","Day 7"];

function loadTrip() {
  try {
    const s = localStorage.getItem("kos_trip");
    if (s) return JSON.parse(s);
  } catch(e) {}
  return { name:"My Kos Trip", days:{ "Day 1":[], "Day 2":[], "Day 3":[] }, activeDays:3 };
}
function saveTrip(trip) {
  try { localStorage.setItem("kos_trip", JSON.stringify(trip)); } catch(e) {}
}

function TripPlannerTab({ places }) {
  const [trip, setTrip] = useState(loadTrip);
  const [activeDay, setActiveDay] = useState("Day 1");
  const [adding, setAdding] = useState(false);
  const [addCat, setAddCat] = useState("beaches");
  const [search, setSearch] = useState("");
  const [confirmClear, setConfirmClear] = useState(false);
  const [saved, setSaved] = useState(false);
  const [expandDay, setExpandDay] = useState(null);

  const ALL_PLACES = Object.values(places).flat();

  function updateTrip(updated) {
    setTrip(updated);
    saveTrip(updated);
  }

  function addPlace(item) {
    const day = trip.days[activeDay] || [];
    if (day.find(p => p.id === item.id)) return; // already added
    const updated = { ...trip, days:{ ...trip.days, [activeDay]:[...day, { id:item.id, name:item.name, emoji:item.emoji, cat:item.cat, note:"" }] } };
    updateTrip(updated);
    setAdding(false);
    setSearch("");
  }

  function removePlace(day, id) {
    const updated = { ...trip, days:{ ...trip.days, [day]:trip.days[day].filter(p => p.id !== id) } };
    updateTrip(updated);
  }

  function updateNote(day, id, note) {
    const updated = { ...trip, days:{ ...trip.days, [day]:trip.days[day].map(p => p.id===id ? {...p, note} : p) } };
    updateTrip(updated);
  }

  function moveUp(day, idx) {
    const arr = [...trip.days[day]];
    if (idx === 0) return;
    [arr[idx-1], arr[idx]] = [arr[idx], arr[idx-1]];
    updateTrip({ ...trip, days:{ ...trip.days, [day]:arr } });
  }

  function moveDown(day, idx) {
    const arr = [...trip.days[day]];
    if (idx === arr.length-1) return;
    [arr[idx], arr[idx+1]] = [arr[idx+1], arr[idx]];
    updateTrip({ ...trip, days:{ ...trip.days, [day]:arr } });
  }

  function setDays(n) {
    const days = {};
    for (let i=1;i<=n;i++) {
      const key = "Day "+i;
      days[key] = trip.days[key] || [];
    }
    updateTrip({ ...trip, days, activeDays:n });
  }

  function clearAll() {
    const days = {};
    Object.keys(trip.days).forEach(k => { days[k] = []; });
    updateTrip({ ...trip, days });
    setConfirmClear(false);
  }

  function handleSave() {
    saveTrip(trip);
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  }

  const totalPlaces = Object.values(trip.days).flat().length;
  const activeDayKeys = TRIP_DAYS.slice(0, trip.activeDays);
  const dayItems = trip.days[activeDay] || [];

  const searchFiltered = useMemo(() => {
    const pool = search.trim() ? ALL_PLACES.filter(p => p.name.toLowerCase().includes(search.toLowerCase()) || p.cat.includes(search.toLowerCase())) : ALL_PLACES.filter(p => p.cat === addCat);
    const dayIds = (trip.days[activeDay]||[]).map(p=>p.id);
    return pool.filter(p => !dayIds.includes(p.id));
  }, [search, addCat, trip, activeDay, ALL_PLACES]);

  const CAT_COLOR_LOCAL = { beaches:"#0EA5E9", restaurants:"#F97316", bars:"#A855F7", sights:"#10B981" };

  return (
    <div style={{ position:"relative", zIndex:1, padding:"20px 16px 120px" }}>

      {/* Header */}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:20 }}>
        <div>
          <div style={{ fontSize:11, letterSpacing:3, color:"#10B981", textTransform:"uppercase", fontFamily:"sans-serif", marginBottom:4 }}>Trip Planner</div>
          <div style={{ fontSize:22, fontWeight:400, color:"#f0e6d3" }}>My Kos Trip</div>
          <div style={{ fontSize:12, color:"#64748b", fontFamily:"sans-serif", marginTop:2 }}>{totalPlaces} place{totalPlaces!==1?"s":""} planned across {trip.activeDays} day{trip.activeDays!==1?"s":""}</div>
        </div>
        <button onClick={() => setConfirmClear(true)} style={{ padding:"8px 12px", background:"rgba(239,68,68,0.1)", border:"1px solid rgba(239,68,68,0.25)", borderRadius:10, color:"#ef4444", fontSize:12, cursor:"pointer", fontFamily:"sans-serif" }}>
          Clear all
        </button>
      </div>

      {/* Confirm clear */}
      {confirmClear && (
        <div style={{ background:"rgba(239,68,68,0.1)", border:"1px solid rgba(239,68,68,0.3)", borderRadius:14, padding:"14px 16px", marginBottom:16, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
          <div style={{ fontSize:13, color:"#f0e6d3", fontFamily:"sans-serif" }}>Clear your entire trip?</div>
          <div style={{ display:"flex", gap:8 }}>
            <button onClick={clearAll} style={{ padding:"7px 14px", background:"#ef4444", border:"none", borderRadius:8, color:"#fff", fontSize:12, cursor:"pointer", fontFamily:"sans-serif" }}>Yes, clear</button>
            <button onClick={() => setConfirmClear(false)} style={{ padding:"7px 14px", background:"rgba(255,255,255,0.06)", border:"1px solid rgba(240,230,211,0.15)", borderRadius:8, color:"#94a3b8", fontSize:12, cursor:"pointer", fontFamily:"sans-serif" }}>Cancel</button>
          </div>
        </div>
      )}

      {/* How many days */}
      <div style={{ background:"rgba(255,255,255,0.04)", border:"1px solid rgba(240,230,211,0.08)", borderRadius:14, padding:"14px 16px", marginBottom:16 }}>
        <div style={{ fontSize:12, color:"#94a3b8", fontFamily:"sans-serif", marginBottom:10 }}>How many days is your trip?</div>
        <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
          {[1,2,3,4,5,6,7].map(n => (
            <button key={n} onClick={() => setDays(n)} style={{ width:38, height:38, borderRadius:10, border:trip.activeDays===n?"1.5px solid #10B981":"1.5px solid rgba(240,230,211,0.15)", background:trip.activeDays===n?"rgba(16,185,129,0.2)":"rgba(255,255,255,0.04)", color:trip.activeDays===n?"#10B981":"#94a3b8", fontSize:14, cursor:"pointer", fontFamily:"sans-serif", fontWeight:600 }}>
              {n}
            </button>
          ))}
        </div>
      </div>

      {/* Day tabs */}
      <div style={{ display:"flex", gap:6, marginBottom:16, overflowX:"auto", paddingBottom:4 }}>
        {activeDayKeys.map(day => {
          const count = (trip.days[day]||[]).length;
          return (
            <button key={day} onClick={() => { setActiveDay(day); setAdding(false); }} style={{ flexShrink:0, padding:"8px 14px", borderRadius:12, border:activeDay===day?"1.5px solid #10B981":"1.5px solid rgba(240,230,211,0.12)", background:activeDay===day?"rgba(16,185,129,0.15)":"rgba(255,255,255,0.04)", color:activeDay===day?"#10B981":"#64748b", fontSize:13, cursor:"pointer", fontFamily:"sans-serif", fontWeight:activeDay===day?600:400, display:"flex", alignItems:"center", gap:6 }}>
              {day}
              {count > 0 && <span style={{ background:activeDay===day?"#10B981":"rgba(255,255,255,0.1)", color:activeDay===day?"#fff":"#64748b", fontSize:10, fontWeight:700, padding:"1px 6px", borderRadius:20 }}>{count}</span>}
            </button>
          );
        })}
      </div>

      {/* Day itinerary */}
      {dayItems.length === 0 && !adding && (
        <div style={{ textAlign:"center", padding:"30px 0 20px", color:"#475569", fontFamily:"sans-serif", fontSize:14 }}>
          <div style={{ fontSize:40, marginBottom:10 }}>📍</div>
          <div style={{ marginBottom:4, color:"#64748b" }}>Nothing planned for {activeDay} yet</div>
          <div style={{ fontSize:12, color:"#334155" }}>Tap below to start adding places</div>
        </div>
      )}

      {dayItems.map((item, idx) => {
        const col = CAT_COLOR_LOCAL[item.cat] || "#94a3b8";
        const isExpanded = expandDay === item.id;
        return (
          <div key={item.id} style={{ background:"rgba(255,255,255,0.04)", border:"1px solid rgba(240,230,211,0.08)", borderRadius:14, marginBottom:10, overflow:"hidden" }}>
            <div style={{ display:"flex", alignItems:"center", padding:"12px 14px", gap:10 }}>
              {/* Order badge */}
              <div style={{ width:26, height:26, borderRadius:"50%", background:col+"22", border:"1px solid "+col+"44", display:"flex", alignItems:"center", justifyContent:"center", fontSize:11, fontWeight:700, color:col, flexShrink:0 }}>
                {idx+1}
              </div>
              <span style={{ fontSize:22 }}>{item.emoji}</span>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:14, fontWeight:600, color:"#f0e6d3" }}>{item.name}</div>
                <div style={{ fontSize:11, color:col, fontFamily:"sans-serif", textTransform:"capitalize" }}>{item.cat}</div>
              </div>
              {/* Controls */}
              <div style={{ display:"flex", gap:4 }}>
                <button onClick={() => setExpandDay(isExpanded?null:item.id)} style={{ width:28, height:28, borderRadius:8, border:"1px solid rgba(240,230,211,0.12)", background:"rgba(255,255,255,0.05)", color:"#64748b", fontSize:13, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center" }}>
                  {isExpanded ? "▲" : "▼"}
                </button>
                <button onClick={() => moveUp(activeDay, idx)} disabled={idx===0} style={{ width:28, height:28, borderRadius:8, border:"1px solid rgba(240,230,211,0.12)", background:"rgba(255,255,255,0.05)", color:idx===0?"#334155":"#94a3b8", fontSize:12, cursor:idx===0?"default":"pointer", display:"flex", alignItems:"center", justifyContent:"center" }}>↑</button>
                <button onClick={() => moveDown(activeDay, idx)} disabled={idx===dayItems.length-1} style={{ width:28, height:28, borderRadius:8, border:"1px solid rgba(240,230,211,0.12)", background:"rgba(255,255,255,0.05)", color:idx===dayItems.length-1?"#334155":"#94a3b8", fontSize:12, cursor:idx===dayItems.length-1?"default":"pointer", display:"flex", alignItems:"center", justifyContent:"center" }}>↓</button>
                <button onClick={() => removePlace(activeDay, item.id)} style={{ width:28, height:28, borderRadius:8, border:"1px solid rgba(239,68,68,0.2)", background:"rgba(239,68,68,0.08)", color:"#ef4444", fontSize:14, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center" }}>×</button>
              </div>
            </div>
            {/* Note input */}
            {isExpanded && (
              <div style={{ padding:"0 14px 12px" }}>
                <input
                  value={item.note}
                  onChange={e => updateNote(activeDay, item.id, e.target.value)}
                  placeholder="Add a personal note (e.g. 8pm reservation, bring sunscreen...)"
                  style={{ width:"100%", boxSizing:"border-box", padding:"9px 12px", background:"rgba(255,255,255,0.06)", border:"1px solid rgba(240,230,211,0.12)", borderRadius:10, color:"#f0e6d3", fontSize:12, fontFamily:"sans-serif", outline:"none" }}
                />
              </div>
            )}
          </div>
        );
      })}

      {/* Add place button */}
      {!adding && (
        <button onClick={() => setAdding(true)} style={{ width:"100%", padding:"13px", background:"rgba(16,185,129,0.1)", border:"1.5px dashed rgba(16,185,129,0.4)", borderRadius:14, color:"#10B981", fontSize:14, cursor:"pointer", fontFamily:"sans-serif", fontWeight:600, marginTop:4, display:"flex", alignItems:"center", justifyContent:"center", gap:8 }}>
          <span style={{ fontSize:18 }}>+</span> Add a place to {activeDay}
        </button>
      )}

      {/* Place picker */}
      {adding && (
        <div style={{ background:"rgba(255,255,255,0.03)", border:"1px solid rgba(240,230,211,0.1)", borderRadius:16, padding:"16px", marginTop:8 }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
            <div style={{ fontSize:14, fontWeight:600, color:"#f0e6d3" }}>Add to {activeDay}</div>
            <button onClick={() => { setAdding(false); setSearch(""); }} style={{ background:"none", border:"none", color:"#64748b", cursor:"pointer", fontSize:18 }}>×</button>
          </div>
          {/* Search */}
          <div style={{ position:"relative", marginBottom:12 }}>
            <span style={{ position:"absolute", left:12, top:"50%", transform:"translateY(-50%)", fontSize:14 }}>🔍</span>
            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search places..." style={{ width:"100%", boxSizing:"border-box", padding:"10px 14px 10px 36px", background:"rgba(255,255,255,0.06)", border:"1px solid rgba(240,230,211,0.12)", borderRadius:12, color:"#f0e6d3", fontSize:13, fontFamily:"sans-serif", outline:"none" }}/>
          </div>
          {/* Category filter */}
          {!search && (
            <div style={{ display:"flex", gap:6, marginBottom:12, overflowX:"auto" }}>
              {CATS.map(c => (
                <button key={c.key} onClick={() => setAddCat(c.key)} style={{ flexShrink:0, padding:"6px 12px", borderRadius:20, border:addCat===c.key?"1.5px solid "+c.color:"1.5px solid rgba(240,230,211,0.12)", background:addCat===c.key?c.color+"22":"rgba(255,255,255,0.04)", color:addCat===c.key?c.color:"#64748b", fontSize:12, cursor:"pointer", fontFamily:"sans-serif" }}>
                  {c.icon} {c.label}
                </button>
              ))}
            </div>
          )}
          {/* Results */}
          <div style={{ maxHeight:260, overflowY:"auto" }}>
            {searchFiltered.length === 0 && <div style={{ textAlign:"center", padding:"20px 0", color:"#475569", fontFamily:"sans-serif", fontSize:13 }}>No places found</div>}
            {searchFiltered.map(item => {
              const col = CAT_COLOR_LOCAL[item.cat] || "#94a3b8";
              return (
                <div key={item.id} onClick={() => addPlace(item)} style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 12px", borderRadius:12, marginBottom:6, cursor:"pointer", background:"rgba(255,255,255,0.04)", border:"1px solid rgba(240,230,211,0.06)" }}>
                  <span style={{ fontSize:22 }}>{item.emoji}</span>
                  <div style={{ flex:1 }}>
                    <div style={{ fontSize:13, fontWeight:600, color:"#f0e6d3" }}>{item.name}</div>
                    <div style={{ fontSize:11, color:col, fontFamily:"sans-serif", textTransform:"capitalize" }}>{item.cat}</div>
                  </div>
                  <div style={{ fontSize:18, color:"#10B981" }}>+</div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Trip summary */}
      {totalPlaces > 0 && !adding && (
        <div style={{ marginTop:20, background:"rgba(16,185,129,0.06)", border:"1px solid rgba(16,185,129,0.2)", borderRadius:16, padding:"16px" }}>
          <div style={{ fontSize:13, fontWeight:600, color:"#10B981", marginBottom:12, fontFamily:"sans-serif" }}>📋 Trip Summary</div>
          {activeDayKeys.map(day => {
            const items = trip.days[day] || [];
            if (items.length === 0) return null;
            return (
              <div key={day} style={{ marginBottom:10 }}>
                <div style={{ fontSize:11, color:"#64748b", fontFamily:"sans-serif", fontWeight:700, textTransform:"uppercase", letterSpacing:1, marginBottom:4 }}>{day}</div>
                {items.map((item,i) => (
                  <div key={item.id} style={{ fontSize:13, color:"#94a3b8", fontFamily:"sans-serif", padding:"2px 0", display:"flex", gap:8 }}>
                    <span style={{ color:"#334155" }}>{i+1}.</span>
                    <span>{item.emoji} {item.name}</span>
                    {item.note && <span style={{ color:"#475569", fontStyle:"italic" }}>— {item.note}</span>}
                  </div>
                ))}
              </div>
            );
          })}
        </div>
      )}

      {/* Save button */}
      <button onClick={handleSave} style={{ width:"100%", marginTop:16, padding:"14px", background:saved?"#10B981":"rgba(16,185,129,0.15)", border:"1.5px solid "+saved?"#10B981":"rgba(16,185,129,0.4)", borderRadius:14, color:saved?"#fff":"#10B981", fontSize:15, cursor:"pointer", fontFamily:"sans-serif", fontWeight:600, transition:"all 0.3s" }}>
        {saved ? "✓ Trip Saved!" : "💾 Save My Trip"}
      </button>
      <div style={{ textAlign:"center", fontSize:11, color:"#334155", fontFamily:"sans-serif", marginTop:6 }}>Your trip is saved to this device</div>
    </div>
  );
