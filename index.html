// ── Mini Weather Widget ──────────────────────────────────────────────────────
function MiniWeatherWidget({ onTap }) {
  const [wx, setWx] = useState(null);

  React.useEffect(() => {
    fetch(
      "https://api.open-meteo.com/v1/forecast?latitude=36.894&longitude=27.288" +
      "&current=temperature_2m,weather_code,wind_speed_10m" +
      "&timezone=Europe%2FAthens"
    )
      .then(r => r.json())
      .then(data => setWx(data.current))
      .catch(() => {});
  }, []);



  return (
    <div onClick={onTap} style={{ cursor:"pointer", background:"rgba(14,165,233,0.1)", border:"1px solid rgba(14,165,233,0.25)", borderRadius:14, padding:"8px 14px", display:"flex", alignItems:"center", gap:8, transition:"all 0.2s" }}>
      <WX_ICON code={wx?.weather_code || 1} size={22}/>
      <div>
        <div style={{ fontSize:16, fontWeight:700, color:"#f0e6d3", fontFamily:"sans-serif", lineHeight:1 }}>
          {wx ? Math.round(wx.temperature_2m)+"°" : "--°"}
        </div>
        <div style={{ fontSize:10, color:"#64748b", fontFamily:"sans-serif", marginTop:1 }}>
          {wx ? Math.round(wx.wind_speed_10m)+" km/h" : "Kos"}
        </div>
      </div>
      <div style={{ fontSize:10, color:"#0EA5E9", fontFamily:"sans-serif", marginLeft:2 }}>›</div>
    </div>
  );
}

// Kos coordinates
const KOS_LAT = 36.8940;
const KOS_LNG = 27.2880;

const WX_CODES = {
  0:"Clear sky", 1:"Mainly clear", 2:"Partly cloudy", 3:"Overcast",
  45:"Foggy", 48:"Icy fog", 51:"Light drizzle", 53:"Drizzle", 55:"Heavy drizzle",
  61:"Light rain", 63:"Rain", 65:"Heavy rain", 71:"Light snow", 73:"Snow", 75:"Heavy snow",
  80:"Light showers", 81:"Showers", 82:"Heavy showers", 95:"Thunderstorm", 99:"Thunderstorm with hail",
};

function WX_ICON({ code, size=40 }) {
  var s = size;
  var col = "#f0e6d3";
  var p = { fill:"none", strokeWidth:"1.6", strokeLinecap:"round", strokeLinejoin:"round" };
  if (code === 0) return <svg width={s} height={s} viewBox="0 0 24 24" {...p}><circle cx="12" cy="12" r="4" stroke="#f59e0b" fill="#f59e0b" fillOpacity="0.3"/><path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="#f59e0b"/></svg>;
  if (code <= 2)  return <svg width={s} height={s} viewBox="0 0 24 24" {...p}><circle cx="10" cy="10" r="3.5" stroke="#f59e0b" fill="#f59e0b" fillOpacity="0.2"/><path d="M8 2v1M4.22 4.22l.7.7M2 8h1M18 8h1M16 4.22l-.7.7M8 16v-1" stroke="#f59e0b"/><path d="M6 14a4 4 0 108 0c0-1.5-.8-3-2-4" stroke="#94a3b8"/><path d="M4 17h14" stroke="#94a3b8"/><path d="M6 20h10" stroke="#94a3b8" strokeOpacity="0.5"/></svg>;
  if (code <= 3)  return <svg width={s} height={s} viewBox="0 0 24 24" {...p}><path d="M20 17.58A5 5 0 0018 8h-1.26A8 8 0 104 16.25" stroke="#94a3b8"/><path d="M4 20h14" stroke="#94a3b8"/></svg>;
  if (code <= 48) return <svg width={s} height={s} viewBox="0 0 24 24" {...p}><path d="M5 12h14M3 8h18M3 16h18" stroke="#94a3b8" strokeOpacity="0.6"/></svg>;
  if (code <= 65) return <svg width={s} height={s} viewBox="0 0 24 24" {...p}><path d="M20 17.58A5 5 0 0018 8h-1.26A8 8 0 104 16.25" stroke="#94a3b8"/><line x1="8" y1="19" x2="8" y2="21" stroke="#60a5fa"/><line x1="12" y1="19" x2="12" y2="21" stroke="#60a5fa"/><line x1="16" y1="19" x2="16" y2="21" stroke="#60a5fa"/></svg>;
  if (code <= 75) return <svg width={s} height={s} viewBox="0 0 24 24" {...p}><path d="M20 17.58A5 5 0 0018 8h-1.26A8 8 0 104 16.25" stroke="#94a3b8"/><path d="M8 19l1 2M12 19l1 2M16 19l1 2" stroke="#e0f2fe" strokeWidth="2"/></svg>;
  if (code <= 82) return <svg width={s} height={s} viewBox="0 0 24 24" {...p}><circle cx="8" cy="9" r="2.5" stroke="#f59e0b"/><path d="M8 3v1M3.5 5l.7.7M2 9h1" stroke="#f59e0b"/><path d="M20 17.58A5 5 0 0018 10h-1.26A6 6 0 106 16.25" stroke="#94a3b8"/><line x1="8" y1="19" x2="8" y2="21" stroke="#60a5fa"/><line x1="12" y1="19" x2="12" y2="21" stroke="#60a5fa"/></svg>;
  return <svg width={s} height={s} viewBox="0 0 24 24" {...p}><path d="M20 17.58A5 5 0 0018 8h-1.26A8 8 0 104 16.25" stroke="#94a3b8"/><path d="M13 11l-4 6h6l-4 6" stroke="#fbbf24" strokeWidth="1.8"/></svg>;
}

const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function WeatherTab() {
  const [wx, setWx] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [unit, setUnit] = useState("C");

  function toF(c) { return Math.round(c * 9/5 + 32); }
  function temp(c) { return unit === "C" ? Math.round(c) + "°C" : toF(c) + "°F"; }

  const fetchWeather = () => {
    setLoading(true);
    setError(null);
    fetch(
      "https://api.open-meteo.com/v1/forecast?latitude="+KOS_LAT+"&longitude="+KOS_LNG+
      "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,relative_humidity_2m,uv_index"+
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max,uv_index_max,sunrise,sunset"+
      "&timezone=Europe%2FAthens&forecast_days=7"
    )
      .then(r => { if (!r.ok) throw new Error("Network error"); return r.json(); })
      .then(data => { setWx(data); setLoading(false); })
      .catch(() => { setError(true); setLoading(false); });
  };

  React.useEffect(() => { fetchWeather(); }, []);

  if (loading) return (
    <div style={{ padding:"24px 16px 120px" }}>
      <div style={{ fontSize:11, letterSpacing:3, color:"#0EA5E9", textTransform:"uppercase", fontFamily:"sans-serif", marginBottom:20 }}>Live Weather</div>
      {/* Animated placeholder skeleton */}
      <div style={{ background:"linear-gradient(135deg,rgba(14,165,233,0.1),rgba(6,24,40,0.4))", border:"1px solid rgba(14,165,233,0.2)", borderRadius:20, padding:"28px 20px", marginBottom:16, textAlign:"center" }}>
        <div style={{ marginBottom:8 }}><WX_ICON code={1} size={72}/></div>
        <div style={{ fontSize:15, color:"#94a3b8", fontFamily:"sans-serif", marginBottom:4 }}>Loading Kos weather...</div>
        <div style={{ fontSize:13, color:"#475569", fontFamily:"sans-serif" }}>Fetching live conditions</div>
        <div style={{ marginTop:20, display:"flex", justifyContent:"center", gap:6 }}>
          {[0,1,2].map(i => (
            <div key={i} style={{ width:8, height:8, borderRadius:"50%", background:"#0EA5E9", opacity:0.4, animation:"pulse 1.2s ease-in-out "+i*0.2+"s infinite" }}/>
          ))}
        </div>
      </div>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr 1fr", gap:10, marginBottom:12 }}>
        {["humidity","wind","wave","uv"].map(icon => (
          <div key={icon} style={{ background:"rgba(255,255,255,0.04)", border:"1px solid rgba(240,230,211,0.06)", borderRadius:14, padding:"14px 8px", textAlign:"center" }}>
            <div style={{ display:"flex", justifyContent:"center", marginBottom:6 }}><NavIcon name={icon} color="#0EA5E9" size={22}/></div>
            <div style={{ height:10, background:"rgba(255,255,255,0.08)", borderRadius:6, marginBottom:4 }}/>
            <div style={{ height:8, background:"rgba(255,255,255,0.05)", borderRadius:6, width:"60%", margin:"0 auto" }}/>
          </div>
        ))}
      </div>
      {[0,1,2,3,4,5,6].map(i => (
        <div key={i} style={{ height:52, background:"rgba(255,255,255,0.03)", border:"1px solid rgba(240,230,211,0.05)", borderRadius:14, marginBottom:8 }}/>
      ))}
      <style dangerouslySetInnerHTML={{__html:"@keyframes pulse{0%,100%{opacity:0.3}50%{opacity:1}}"}}/>
    </div>
  );

  if (error || !wx) return (
    <div style={{ padding:"24px 16px 120px" }}>
      <div style={{ fontSize:11, letterSpacing:3, color:"#0EA5E9", textTransform:"uppercase", fontFamily:"sans-serif", marginBottom:20 }}>Live Weather</div>
      <div style={{ background:"linear-gradient(135deg,rgba(14,165,233,0.1),rgba(6,24,40,0.4))", border:"1px solid rgba(14,165,233,0.2)", borderRadius:20, padding:"32px 20px", textAlign:"center", marginBottom:16 }}>
        <div style={{ marginBottom:12 }}><WX_ICON code={1} size={64}/></div>
        <div style={{ fontSize:20, color:"#f0e6d3", fontFamily:"Georgia,serif", marginBottom:6 }}>Kos Island, Greece</div>
        <div style={{ fontSize:13, color:"#64748b", fontFamily:"sans-serif", lineHeight:1.6, marginBottom:20 }}>
          Live weather is on its way! We are connecting to our weather service, this will be available once the app is live online.
        </div>
        <button onClick={fetchWeather} style={{ padding:"12px 24px", background:"rgba(14,165,233,0.2)", border:"1px solid rgba(14,165,233,0.4)", borderRadius:12, color:"#0EA5E9", fontSize:14, cursor:"pointer", fontFamily:"sans-serif", fontWeight:600 }}>
          Try again
        </button>
      </div>
      {/* Static Kos weather info as placeholder */}
      <div style={{ fontSize:11, letterSpacing:3, color:"#94a3b8", textTransform:"uppercase", fontFamily:"sans-serif", marginBottom:12 }}>Typical Kos Climate</div>
      {[
        { month:"June – August",  desc:"Peak summer. Consistently 30–36°C, sunshine every day, very low chance of rain. Sea around 27°C.", icon:"☀️", color:"#F97316" },
        { month:"May & September", desc:"Warm and sunny at 24–29°C. Fewer crowds, comfortable temperatures. Perfect for sightseeing.", icon:"🌤️", color:"#10B981" },
        { month:"April & October", desc:"Mild at 18–23°C. Some cloud and occasional showers but still very pleasant. Great for exploring.", icon:"⛅", color:"#0EA5E9" },
        { month:"November – March", desc:"Quieter season. 12–17°C, more rain. Many tourist businesses closed but the island is peaceful.", icon:"🌧️", color:"#6366F1" },
      ].map(s => (
        <div key={s.month} style={{ background:"rgba(255,255,255,0.04)", border:"1px solid rgba(240,230,211,0.08)", borderRadius:14, padding:"14px 16px", marginBottom:10, display:"flex", gap:12, alignItems:"flex-start" }}>
          <div style={{ width:44, height:44, borderRadius:12, background:s.color+"18", border:"1px solid "+s.color+"30", display:"flex", alignItems:"center", justifyContent:"center", fontSize:22, flexShrink:0 }}>
            {s.icon}
          </div>
          <div>
            <div style={{ fontSize:14, fontWeight:600, color:s.color, marginBottom:3, fontFamily:"sans-serif" }}>{s.month}</div>

          </div>

      <div style={{ marginTop:8, padding:"12px 16px", background:"rgba(255,255,255,0.03)", border:"1px solid rgba(240,230,211,0.06)", borderRadius:14 }}>
        <p style={{ margin:0, fontSize:12, color:"#475569", fontFamily:"sans-serif", lineHeight:1.6 }}>

        </p>
      </div>
    </div>
  );

  const cur = wx.current;
  const daily = wx.daily;
  const now = new Date();

  // UV advice
  const uvLevel = uv => uv <= 2 ? ["Low","#10B981"] : uv <= 5 ? ["Moderate","#EAB308"] : uv <= 7 ? ["High","#F97316"] : uv <= 10 ? ["Very High","#ef4444"] : ["Extreme","#A855F7"];
  const [uvLabel, uvColor] = uvLevel(cur.uv_index);

  // Sea temp (estimated from air, Aegean is typically air -4°C in summer)
  const seaTemp = Math.round(cur.temperature_2m - 3);

  return (

        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
          <div>
            <div style={{ fontSize:64, fontWeight:200, color:"#f0e6d3", lineHeight:1, fontFamily:"sans-serif" }}>
              {temp(cur.temperature_2m)}

            <div style={{ fontSize:14, color:"#94a3b8", fontFamily:"sans-serif", marginTop:4 }}>

        {/* Stats row */}

          {[

            { icon:"dive", color:"#0EA5E9", title:"Excellent Snorkelling & Diving", desc:"Maximum underwater visibility today. Head to Agios Fokas or Psalidi for snorkelling, or book a dive at the Kefalos sites.", beach:"Agios Fokas, Psalidi, Kefalos" },

            { icon:"swim", color:"#10B981", title:"Swim on the South Coast", desc:"North coast is choppy today, but the south coast is sheltered from the Meltemi. Head to Kefalos, Agios Theologos or Limnionas for calm clear water.", beach:"Kefalos, Agios Theologos, Limnionas, Camel Beach" },
            { icon:"climb", color:"#F97316", title:"Day Trip to Kalymnos", desc:"Meltemi means rock climbing conditions in Kalymnos are perfect. Take the morning ferry and spend the day on the cliffs.", beach:null },
            { icon:"jeep", color:"#EAB308", title:"Jeep Safari Inland", desc:"Wind too strong for the beach? Head into the hills, Zia, Pyli and the mountain villages are sheltered and beautiful.", beach:null },
          ];
        } else if (isSouthWind && isWindy) {
          conditions = [

            { icon:"dive", color:"#10B981", title:"Good Snorkelling, North Beaches", desc:"Calm water on the north coast means excellent visibility for snorkelling today.", beach:"Tigaki, Psalidi, Lambi" },
            { icon:"sail", color:"#6366F1", title:"Sailing Conditions", desc:"A south breeze makes for pleasant sailing. Check with harbour operators for conditions before booking.", beach:null },
          ];
        } else if (isLightBreeze) {
          conditions = [
            { icon:"swim", color:"#0EA5E9", title:"Great Swimming Everywhere", desc:"Light breeze keeps things comfortable without disturbing the sea. All beaches are in good condition today.", beach:"All beaches" },
            { icon:"cycle", color:"#10B981", title:"Ideal for Cycling", desc:"A light breeze is perfect cycling weather. Head along the coastal path or up toward the villages.", beach:null },
            { icon:"fish", color:"#EC4899", title:"Good Fishing Conditions", desc:"Light winds are ideal for shore fishing. Contact Dream Catch Kos for a session at one of their secret spots.", beach:null },

const NEARBY_CATS = [
  { key:"supermarket", label:"Markets",   icon:"shop", color:"#10B981", query:"supermarket|mini market" },
  { key:"pharmacy",    label:"Pharmacy",  icon:"medical", color:"#ef4444", query:"pharmacy|apothecary" },

function NearbyTab() {
  const [activeCat, setActiveCat] = useState("supermarket");
  const [location, setLocation] = useState(null);
  const [locError, setLocError] = useState(null);
  const [loading, setLoading] = useState(false);
  const [results, setResults] = useState([]);
  const [searched, setSearched] = useState(false);

  const cat = NEARBY_CATS.find(c => c.key === activeCat);

  function getLocation() {
    setLoading(true);
    setLocError(null);
    setResults([]);
    setSearched(false);
    if (!navigator.geolocation) {
      setLocError("Geolocation is not supported by your browser.");
      setLoading(false);
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos => {
        setLocation({ lat: pos.coords.latitude, lng: pos.coords.longitude });
        setLoading(false);
        setSearched(true);
      },
      err => {
        setLocError("Could not get your location. Please make sure location access is enabled for this site.");
        setLoading(false);
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  // Open Google Maps search near the user
  function openMapsSearch() {
    if (!location) return;
    const query = encodeURIComponent(cat.query + " near me");
    const url = "https://www.google.com/maps/search/" + query + "/@" + location.lat + "," + location.lng + ",15z";
    window.open(url, "_blank");
  }

  // Build direct Google Maps links for common spots
  function buildPlaceLink(lat, lng, name) {
    return "https://www.google.com/maps/search/" + encodeURIComponent(name) + "/@" + lat + "," + lng + ",17z";
  }

  // Haversine distance in km
  function dist(lat1, lng1, lat2, lng2) {
    const R = 6371;
    const dLat = (lat2-lat1) * Math.PI/180;
    const dLng = (lng2-lng1) * Math.PI/180;
    const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  // Static known locations for common places on Kos (fallback when Maps API not available)
  const KNOWN_PLACES = {
    supermarket: [
      { name:"AB Vassilopoulos Kos Town",    lat:36.8938, lng:27.2882, note:"Large supermarket, full range" },
      { name:"Lidl Kos",                     lat:36.8870, lng:27.2710, note:"Budget supermarket, great for basics" },
      { name:"Sklavenitis Kos",              lat:36.8855, lng:27.2695, note:"Large Greek supermarket chain" },
      { name:"Super Market Tigaki",          lat:36.8660, lng:27.0690, note:"Convenient for Tigaki area" },
      { name:"Mini Market Kardamena",        lat:36.7842, lng:27.1338, note:"Local mini market in Kardamena" },
      { name:"Mini Market Mastichari",       lat:36.8465, lng:27.0068, note:"Handy for Mastichari visitors" },
      { name:"Bazaar Supermarket Kos Town",  lat:36.8930, lng:27.2860, note:"Central location, long opening hours" },
      { name:"Mini Market Kefalos",          lat:36.7380, lng:26.9980, note:"Serves the Kefalos peninsula area" },
    ],
    pharmacy: [
      { name:"Pharmacy Kos Town Centre",     lat:36.8940, lng:27.2875, note:"Central pharmacy, English spoken" },
      { name:"Farmakeio Nafklirou",          lat:36.8912, lng:27.2868, note:"Near Bar Street, handy for tourists" },
      { name:"Pharmacy Tigaki",              lat:36.8655, lng:27.0685, note:"Serves the Tigaki beach area" },
      { name:"Pharmacy Kardamena",           lat:36.7845, lng:27.1342, note:"Main pharmacy in Kardamena resort" },
      { name:"Farmakeio Mastichari",         lat:36.8460, lng:27.0062, note:"Local pharmacy near the port" },
      { name:"Pharmacy Kefalos",             lat:36.7375, lng:26.9975, note:"Serves the southwest of the island" },
      { name:"24hr Pharmacy Kos (rota)",     lat:36.8935, lng:27.2878, note:"Dial 1434 to find current 24hr pharmacy" },
    ],
    bicycle: [
      { name:"Electric Wheels Kos",           lat:36.908659, lng:27.279861, note:"Fat bikes & choppers — e-bikes for all ages. No licence needed.", phone:"+30 6942984136" },
      { name:"George's Bike Rental Kos",     lat:36.8935, lng:27.2872, note:"Scooters, bikes & quads. Very popular." },
      { name:"Moto Fun Kos Town",            lat:36.8928, lng:27.2865, note:"Wide range of bikes and scooters" },
      { name:"Kos Rentals Harbour",          lat:36.8958, lng:27.2932, note:"Bikes and scooters near the port" },
      { name:"Auto Moto Tigaki",             lat:36.8658, lng:27.0688, note:"Rentals in the Tigaki area" },
      { name:"Speed Rentals Kardamena",      lat:36.7840, lng:27.1336, note:"Bikes, scooters and quads" },
      { name:"Mastichari Bike Hire",         lat:36.8462, lng:27.0065, note:"Convenient for exploring the north" },
      { name:"Kefalos Moto Rentals",         lat:36.7378, lng:26.9978, note:"Base yourself in the south and explore" },
      { name:"Paradise Rentals",             lat:36.7838, lng:27.1170, note:"Near Paradise Beach, scooters only" },
    ],
  };

  const sortedPlaces = location
    ? [...(KNOWN_PLACES[activeCat]||[])].sort((a,b) => dist(location.lat,location.lng,a.lat,a.lng) - dist(location.lat,location.lng,b.lat,b.lng))
    : KNOWN_PLACES[activeCat]||[];

  return (
    <div style={{ position:"relative", zIndex:1, padding:"20px 16px 120px" }}>
      <div style={{ marginBottom:20 }}>
        <div style={{ fontSize:11, letterSpacing:3, color:"#10B981", textTransform:"uppercase", fontFamily:"sans-serif", marginBottom:4 }}>Find Nearby</div>
        <div style={{ fontSize:22, fontWeight:400, color:"#f0e6d3", marginBottom:6 }}>What do you need?</div>
        <p style={{ margin:0, fontSize:13, color:"#64748b", fontFamily:"sans-serif" }}>Share your location to see the closest places first.</p>
      </div>

      {/* Category pills */}
      <div style={{ display:"flex", gap:8, marginBottom:20 }}>
        {NEARBY_CATS.map(c => (
          <button key={c.key} onClick={() => { setActiveCat(c.key); setSearched(false); setResults([]); }} style={{ flex:1, padding:"12px 8px", borderRadius:14, border:activeCat===c.key?"1.5px solid "+c.color:"1.5px solid rgba(240,230,211,0.15)", background:activeCat===c.key?c.color+"22":"rgba(255,255,255,0.04)", color:activeCat===c.key?c.color:"#94a3b8", fontSize:12, cursor:"pointer", fontFamily:"sans-serif", display:"flex", flexDirection:"column", alignItems:"center", gap:4 }}>
            <span style={{ fontSize:24 }}>{c.icon}</span>
            <span>{c.label}</span>
          </button>
        ))}
      </div>

      {/* Location button */}
      {!searched && (
        <button onClick={getLocation} disabled={loading} style={{ width:"100%", padding:"14px", background:loading?"rgba(255,255,255,0.04)":"linear-gradient(135deg,"+cat.color+","+cat.color+"cc)", border:"none", borderRadius:14, color:"#fff", fontSize:15, cursor:loading?"not-allowed":"pointer", fontFamily:"sans-serif", fontWeight:600, marginBottom:16, display:"flex", alignItems:"center", justifyContent:"center", gap:8, opacity:loading?0.7:1 }}>
          {loading ? (
            <><span style={{ display:"inline-block", width:16, height:16, border:"2px solid rgba(255,255,255,0.3)", borderTopColor:"#fff", borderRadius:"50%", animation:"spin 0.8s linear infinite" }}/> Getting your location...</>
          ) : (
            <><span>📍</span> Find Nearest {cat.label}</>
          )}
        </button>
      )}

      {locError && (
        <div style={{ background:"#ef444418", border:"1px solid #ef444440", borderRadius:12, padding:"12px 16px", marginBottom:16, fontSize:13, color:"#ef4444", fontFamily:"sans-serif", lineHeight:1.5 }}>
          ⚠️ {locError}
        </div>
      )}

      {/* Results */}
      {(searched || true) && sortedPlaces.map((place, i) => {
        const d = location ? dist(location.lat, location.lng, place.lat, place.lng) : null;
        return (
          <a key={i} href={buildPlaceLink(place.lat, place.lng, place.name)} target="_blank" rel="noreferrer" style={{ textDecoration:"none", display:"block", marginBottom:10 }}>
            <div style={{ background:"rgba(255,255,255,0.04)", border:"1px solid rgba(240,230,211,0.08)", borderRadius:14, padding:"14px 16px", display:"flex", alignItems:"center", gap:12, transition:"all 0.2s" }}>
              <div style={{ width:44, height:44, borderRadius:12, background:cat.color+"20", border:"1px solid "+cat.color+"40", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
                <NavIcon name={cat.key} color={cat.color} size={22}/>
              </div>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:14, fontWeight:600, color:"#f0e6d3", marginBottom:2 }}>{place.name}</div>
                <div style={{ fontSize:12, color:"#64748b", fontFamily:"sans-serif" }}>{place.note}</div>
              </div>
              <div style={{ textAlign:"right", flexShrink:0 }}>
                {d !== null && (
                  <div style={{ fontSize:13, fontWeight:600, color:cat.color, fontFamily:"sans-serif" }}>
                    {d < 1 ? Math.round(d*1000)+"m" : d.toFixed(1)+"km"}
                  </div>
                )}
                <div style={{ fontSize:11, color:"#475569", fontFamily:"sans-serif", marginTop:2 }}>Open Maps ↗</div>
              </div>
            </div>
          </a>
        );
      })}

      {searched && (
        <button onClick={openMapsSearch} style={{ width:"100%", marginTop:8, padding:"13px", background:"rgba(255,255,255,0.04)", border:"1px solid "+cat.color+"40", borderRadius:14, color:cat.color, fontSize:14, cursor:"pointer", fontFamily:"sans-serif", fontWeight:600 }}>
          🗺️ Search More on Google Maps
        </button>
      )}

      {searched && (
        <button onClick={() => { setSearched(false); setLocation(null); }} style={{ width:"100%", marginTop:8, padding:"11px", background:"none", border:"none", color:"#475569", fontSize:13, cursor:"pointer", fontFamily:"sans-serif" }}>
          Reset location
        </button>
      )}

      <style dangerouslySetInnerHTML={{__html:"@keyframes spin { to { transform: rotate(360deg); } }"}}/>
    </div>
  );
}

function App() {

  const [openTT, setOpenTT] = useState(null);
  const [showAdmin, setShowAdmin] = useState(false);

  const [adminPw, setAdminPw] = useState("");
  const [adminError, setAdminError] = useState(false);
  const [tapCount, setTapCount] = useState(0);

  const ALL_PLACES = useMemo(() => Object.values(places).flat(), [places]);

  const searchResults = useMemo(() => {
    if (!search.trim()) return null;
    const q = search.toLowerCase();
    return ALL_PLACES.filter(i => i.name.toLowerCase().includes(q) || i.desc.toLowerCase().includes(q) || i.cat.includes(q));
  }, [search, ALL_PLACES]);

  const listItems = useMemo(() => {
    const base = searchResults || places[activeCat] || [];
    return [...base].sort((a, b) => {
      // Featured/paying businesses first
      if (a.featured && !b.featured) return -1;
      if (!a.featured && b.featured) return 1;
      // Then by rating descending
      return parseFloat(b.rating) - parseFloat(a.rating);
    });
  }, [searchResults, places, activeCat]);
  const mapItems = searchResults || ALL_PLACES;



  // Scroll to top when nav changes
  React.useEffect(() => {
    const el = document.getElementById("main-scroll");
    if (el) el.scrollTop = 0;
  }, [nav]);

  function handleLogoTap() {
    const next = tapCount + 1;
    setTapCount(next);
    if (next >= 5) { setAdminPrompt(true); setTapCount(0); return; }
    // Single tap goes home
    setNav("home");
    setOpenTT(null);
  }

  function handleAdminLogin() {
    if (adminPw === ADMIN_PASSWORD) {
      setAdminPrompt(false); setAdminPw(""); setAdminError(false); setShowAdmin(true);
    } else {
      setAdminError(true);
    }
  }

  function handleSavePlaces(updated) {
    setPlaces(updated);
    savePlaces(updated);

          {LOCAL_BUSES.map(b => <TTCard key={b.id} item={b} icon="🚍" isOpen={openTT===b.id} onToggle={() => setOpenTT(openTT===b.id?null:b.id)}/>)}
          <div style={{ marginTop:8, padding:"14px 16px", background:"rgba(255,255,255,0.03)", border:"1px solid rgba(240,230,211,0.06)", borderRadius:14 }}>
            <p style={{ margin:0, fontSize:12, color:"#475569", fontFamily:"sans-serif", lineHeight:1.7 }}>
              🚍 <strong style={{ color:"#64748b" }}>DEAS Bus Stop</strong> is on the south side of Kos Town harbour. Tickets are slightly cheaper at the kiosk than on the bus. The intercity KTEL buses (to Tigaki, Kardamena, Kefalos etc.) depart from Kleopatras Street.
            </p>
          </div>
        </div>
      )}

      {/* SOS / Emergency */}
      {nav==="sos" && (
        <div style={{ position:"relative", zIndex:1, padding:"20px 16px 120px" }}>
          <div style={{ marginBottom:20 }}>
            <div style={{ fontSize:11, letterSpacing:3, color:"#ef4444", textTransform:"uppercase", fontFamily:"sans-serif", marginBottom:4 }}>Emergency and Useful Numbers</div>
            <p style={{ margin:0, fontSize:13, color:"#64748b", fontFamily:"sans-serif" }}>Tap any number to call directly. Save these before you need them.</p>
          </div>
          <div style={{ background:"#ef444418", border:"1px solid #ef444440", borderRadius:14, padding:"14px 16px", marginBottom:20, display:"flex", gap:12, alignItems:"center" }}>
            <span style={{ fontSize:28 }}>🚨</span>
            <div>
              <div style={{ fontSize:15, fontWeight:600, color:"#ef4444", marginBottom:2 }}>Pan-European Emergency</div>
              <div style={{ fontSize:22, fontWeight:700, color:"#f0e6d3", fontFamily:"sans-serif", letterSpacing:2 }}>112</div>
              <div style={{ fontSize:12, color:"#94a3b8", fontFamily:"sans-serif" }}>Works from any phone, any network, even no SIM</div>
            </div>
          </div>
          {EMERGENCY.map(section => (
            <div key={section.id} style={{ marginBottom:24 }}>
              <div style={{ fontSize:11, color:section.color, textTransform:"uppercase", letterSpacing:2, fontFamily:"sans-serif", marginBottom:10 }}>{section.category}</div>
              {section.items.map((item,i) => (
                <a key={i} href={"tel:"+item.number.replace(/\s/g,"")} style={{ textDecoration:"none", display:"block" }}>
                  <div style={{ background:"rgba(255,255,255,0.04)", border:"1px solid rgba(240,230,211,0.08)", borderRadius:14, padding:"14px 16px", marginBottom:8, display:"flex", gap:12, alignItems:"center", transition:"all 0.2s" }}>
                    <div style={{ width:42, height:42, borderRadius:12, background:section.color+"18", border:"1px solid "+section.color+"30", display:"flex", alignItems:"center", justifyContent:"center", fontSize:20, flexShrink:0 }}>{item.icon}</div>
                    <div style={{ flex:1 }}>
                      <div style={{ fontSize:14, fontWeight:600, color:"#f0e6d3", marginBottom:2 }}>{item.name}</div>
                      <div style={{ fontSize:12, color:"#94a3b8", fontFamily:"sans-serif", marginBottom:3 }}>{item.desc}</div>
                    </div>
                    <div style={{ textAlign:"right", flexShrink:0 }}>
                      <div style={{ fontSize:15, fontWeight:700, color:section.color, fontFamily:"sans-serif", letterSpacing:1 }}>{item.number}</div>
                      <div style={{ fontSize:10, color:"#475569", fontFamily:"sans-serif", marginTop:2 }}>tap to call</div>
                    </div>
                  </div>
                </a>
              ))}
            </div>
          ))}
        </div>
      )}

      {/* Get Listed */}
      {nav==="listed" && (
        <div style={{ position:"relative", zIndex:1, padding:"20px 16px 120px" }}>
          <div style={{ marginBottom:24 }}>
            <div style={{ fontSize:11, letterSpacing:3, color:"#F97316", textTransform:"uppercase", fontFamily:"sans-serif", marginBottom:6 }}>For Business Owners</div>
            <div style={{ fontSize:22, fontWeight:400, color:"#f0e6d3", marginBottom:8 }}>Get Your Business Listed</div>
            <p style={{ margin:"0 0 6px", fontSize:13, color:"#94a3b8", fontFamily:"sans-serif", lineHeight:1.6 }}>Want your bar, restaurant or activity featured on Kos Unlocked? Get in touch and we'll add you to the guide, completely free while we grow our audience.</p>
            <p style={{ margin:0, fontSize:13, color:"#94a3b8", fontFamily:"sans-serif", lineHeight:1.6 }}>Send us a WhatsApp with your business name and we will take care of the rest.</p>
          </div>

          {/* WhatsApp + Email buttons — top of page */}
          <div style={{ display:"flex", gap:10, marginBottom:24 }}>
            <a href="https://wa.me/31649301578?text=Hi%2C%20I%20would%20like%20to%20list%20my%20business%20on%20Kos%20Unlocked" target="_blank" rel="noreferrer" style={{ textDecoration:"none", flex:1 }}>
              <div style={{ background:"#25D366", borderRadius:14, padding:"14px 10px", display:"flex", alignItems:"center", justifyContent:"center", gap:8, cursor:"pointer", boxShadow:"0 4px 20px rgba(37,211,102,0.3)", height:"100%" }}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                <span style={{ fontSize:14, fontWeight:700, color:"#fff", fontFamily:"sans-serif" }}>WhatsApp</span>
              </div>
            </a>
            <a href="mailto:kosunlocked@gmail.com" style={{ textDecoration:"none", flex:1 }}>
              <div style={{ background:"rgba(14,165,233,0.15)", border:"1.5px solid rgba(14,165,233,0.4)", borderRadius:14, padding:"14px 10px", display:"flex", alignItems:"center", justifyContent:"center", gap:8, cursor:"pointer", boxShadow:"0 4px 20px rgba(14,165,233,0.15)", height:"100%" }}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0EA5E9" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                <span style={{ fontSize:14, fontWeight:700, color:"#0EA5E9", fontFamily:"sans-serif" }}>E-mail Us</span>
              </div>
            </a>
          </div>

          {/* What you get */}
          <div style={{ marginBottom:16 }}>
            {[
              { icon:"photo", title:"Photo & Description", desc:"Your own card with a photo, description and your story told the way you want it." },
              { icon:"contact", title:"Direct Contact Buttons", desc:"Tourists can call you, visit your website or find you on Instagram with one tap." },
              { icon:"pin", title:"Map Listing", desc:"Your location pinned on the Kos Unlocked map so tourists can find you easily." },
              { icon:"tip", title:"Local Tip from You", desc:"Add your own insider tip, a personal touch that makes tourists want to visit." },
              { icon:"globe", title:"Reach Every Tourist", desc:"Kos gets over 1 million visitors a year. Every one of them is a potential customer." },
            ].map((f,i) => (
              <div key={i} style={{ display:"flex", gap:12, alignItems:"flex-start", padding:"14px 0", borderBottom:"1px solid rgba(240,230,211,0.06)" }}>
                <div style={{ width:40, height:40, borderRadius:12, background:"rgba(249,115,22,0.12)", border:"1px solid rgba(249,115,22,0.2)", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}><NavIcon name={f.icon} color="#F97316" size={20}/></div>
                <div>
                  <div style={{ fontSize:14, fontWeight:600, color:"#f0e6d3", marginBottom:3, fontFamily:"sans-serif" }}>{f.title}</div>
                  <div style={{ fontSize:12, color:"#64748b", fontFamily:"sans-serif", lineHeight:1.5 }}>{f.desc}</div>
                </div>
              </div>
            ))}
          </div>

          {/* Free while growing banner */}
          <div style={{ background:"linear-gradient(135deg,rgba(16,185,129,0.12),rgba(255,255,255,0.03))", border:"1px solid rgba(16,185,129,0.3)", borderRadius:16, padding:"16px 18px", marginBottom:20, display:"flex", gap:12, alignItems:"center" }}>
            <span style={{ flexShrink:0, display:"flex", alignItems:"center" }}><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#10B981" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6L12 2z"/></svg></span>
            <div>
              <div style={{ fontSize:14, fontWeight:600, color:"#10B981", marginBottom:3, fontFamily:"sans-serif" }}>Free while we grow</div>
              <div style={{ fontSize:12, color:"#64748b", fontFamily:"sans-serif", lineHeight:1.5 }}>We are building our audience right now. Get listed for free and be part of Kos Unlocked from the very beginning.</div>
            </div>
          </div>


        </div>
      )}

      {/* Hamburger Menu Button */}
      <div style={{ position:"fixed", bottom:28, right:20, zIndex:100 }}>
        <button onClick={() => setMenuOpen(true)} style={{ width:56, height:56, borderRadius:"50%", background:"linear-gradient(135deg,rgba(14,165,233,0.9),rgba(8,100,180,0.9))", border:"1.5px solid rgba(14,165,233,0.6)", backdropFilter:"blur(16px)", boxShadow:"0 4px 24px rgba(0,0,0,0.4), 0 0 0 1px rgba(14,165,233,0.2)", cursor:"pointer", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:5 }}>
          <div style={{ width:20, height:2, background:"#fff", borderRadius:2 }}/>
          <div style={{ width:20, height:2, background:"#fff", borderRadius:2 }}/>
          <div style={{ width:20, height:2, background:"#fff", borderRadius:2 }}/>
        </button>
      </div>

      {/* Menu Overlay */}
      {menuOpen && (
        <div style={{ position:"fixed", inset:0, zIndex:200 }}>
          {/* Backdrop */}
          <div onClick={() => setMenuOpen(false)} style={{ position:"absolute", inset:0, background:"rgba(0,0,0,0.6)", backdropFilter:"blur(4px)" }}/>
          {/* Drawer */}
          <div style={{ position:"absolute", bottom:0, left:"50%", transform:"translateX(-50%)", width:"100%", maxWidth:430, background:"linear-gradient(180deg,#0d1f38 0%,#08131f 100%)", borderTop:"1px solid rgba(14,165,233,0.2)", borderRadius:"24px 24px 0 0", paddingBottom:40, overflow:"hidden" }}>
            {/* Handle */}
            <div style={{ display:"flex", justifyContent:"center", paddingTop:12, marginBottom:4 }}>
              <div style={{ width:40, height:4, borderRadius:2, background:"rgba(255,255,255,0.15)" }}/>
            </div>
            {/* Header */}
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"12px 24px 16px" }}>
              <div>
                <div style={{ fontSize:18, fontWeight:600, color:"#f0e6d3", fontFamily:"Georgia, serif", letterSpacing:2 }}>KOS UNLOCKED</div>
                <div style={{ fontSize:11, color:"#475569", fontFamily:"sans-serif", letterSpacing:1 }}>Your local island guide</div>
              </div>
              <button onClick={() => setMenuOpen(false)} style={{ background:"rgba(255,255,255,0.08)", border:"1px solid rgba(255,255,255,0.1)", borderRadius:"50%", width:36, height:36, cursor:"pointer", color:"#94a3b8", fontSize:18, display:"flex", alignItems:"center", justifyContent:"center" }}>✕</button>
            </div>
            {/* Nav items — 2 column grid */}
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, padding:"0 16px" }}>
              {NAV.map(n => {
                const isActive = nav === n.key;
                return (
                  <button key={n.key} onClick={() => { setNav(n.key); setOpenTT(null); setMenuOpen(false); window.scrollTo(0,0); }} style={{ padding:"14px 16px", borderRadius:16, border:"1.5px solid", borderColor:isActive?"rgba(14,165,233,0.5)":"rgba(255,255,255,0.08)", background:isActive?"linear-gradient(135deg,rgba(14,165,233,0.2),rgba(14,165,233,0.08))":"rgba(255,255,255,0.04)", cursor:"pointer", display:"flex", alignItems:"center", gap:10, transition:"all 0.15s" }}>
                    <NavIcon name={n.icon} color={isActive?"#7dd3fc":"#64748b"} size={20}/>
                    <span style={{ fontSize:14, color:isActive?"#7dd3fc":"#94a3b8", fontFamily:"sans-serif", fontWeight:isActive?600:400, textAlign:"left" }}>{n.label}</span>
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      )}

      <style dangerouslySetInnerHTML={{__html:`
        @keyframes slideUp {
          from { transform: translateX(-50%) translateY(100%); }
          to   { transform: translateX(-50%) translateY(0); }
        }
      `}}/>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
