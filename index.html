// ── Trip Planner ─────────────────────────────────────────────────────────────
const TRIP_DAYS = ["Day 1","Day 2","Day 3","Day 4","Day 5","Day 6","Day 7"];

function loadTrip() {
  try {
    const s = localStorage.getItem("kos_trip");
    if (s) return JSON.parse(s);
  } catch(e) {}
  return { name:"My Kos Trip", days:{ "Day 1":[], "Day 2":[], "Day 3":[] }, activeDays:3 };
}
function saveTrip(trip) {
  try { localStorage.setItem("kos_trip", JSON.stringify(trip)); } catch(e) {}
}

function TripPlannerTab({ places }) {
  const [trip, setTrip] = useState(loadTrip);
  const [activeDay, setActiveDay] = useState("Day 1");
  const [adding, setAdding] = useState(false);
  const [addCat, setAddCat] = useState("beaches");
  const [search, setSearch] = useState("");
  const [confirmClear, setConfirmClear] = useState(false);
  const [saved, setSaved] = useState(false);
  const [expandDay, setExpandDay] = useState(null);

  const ALL_PLACES = Object.values(places).flat();

  function updateTrip(updated) {
    setTrip(updated);
    saveTrip(updated);
  }

  function addPlace(item) {
    const day = trip.days[activeDay] || [];
    if (day.find(p => p.id === item.id)) return; // already added
    const updated = { ...trip, days:{ ...trip.days, [activeDay]:[...day, { id:item.id, name:item.name, emoji:item.emoji, cat:item.cat, note:"" }] } };
    updateTrip(updated);
    setAdding(false);
    setSearch("");
  }

  function removePlace(day, id) {
    const updated = { ...trip, days:{ ...trip.days, [day]:trip.days[day].filter(p => p.id !== id) } };
    updateTrip(updated);
  }

  function updateNote(day, id, note) {
    const updated = { ...trip, days:{ ...trip.days, [day]:trip.days[day].map(p => p.id===id ? {...p, note} : p) } };
    updateTrip(updated);
  }

  function moveUp(day, idx) {
    const arr = [...trip.days[day]];
    if (idx === 0) return;
    [arr[idx-1], arr[idx]] = [arr[idx], arr[idx-1]];
    updateTrip({ ...trip, days:{ ...trip.days, [day]:arr } });
  }

  function moveDown(day, idx) {
    const arr = [...trip.days[day]];
    if (idx === arr.length-1) return;
    [arr[idx], arr[idx+1]] = [arr[idx+1], arr[idx]];
    updateTrip({ ...trip, days:{ ...trip.days, [day]:arr } });
  }

  function setDays(n) {
    const days = {};
    for (let i=1;i<=n;i++) {
      const key = "Day "+i;
      days[key] = trip.days[key] || [];
    }
    updateTrip({ ...trip, days, activeDays:n });
  }

  function clearAll() {
    const days = {};
    Object.keys(trip.days).forEach(k => { days[k] = []; });
    updateTrip({ ...trip, days });
    setConfirmClear(false);
  }

  function handleSave() {
    saveTrip(trip);
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  }

  const totalPlaces = Object.values(trip.days).flat().length;
  const activeDayKeys = TRIP_DAYS.slice(0, trip.activeDays);
  const dayItems = trip.days[activeDay] || [];

  const searchFiltered = useMemo(() => {
    const pool = search.trim() ? ALL_PLACES.filter(p => p.name.toLowerCase().includes(search.toLowerCase()) || p.cat.includes(search.toLowerCase())) : ALL_PLACES.filter(p => p.cat === addCat);
    const dayIds = (trip.days[activeDay]||[]).map(p=>p.id);
    return pool.filter(p => !dayIds.includes(p.id));
  }, [search, addCat, trip, activeDay, ALL_PLACES]);

  const CAT_COLOR_LOCAL = { beaches:"#0EA5E9", restaurants:"#F97316", bars:"#A855F7", sights:"#10B981" };

  return (
    <div style={{ position:"relative", zIndex:1, padding:"20px 16px 120px" }}>

      {/* Header */}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:20 }}>
        <div>
          <div style={{ fontSize:11, letterSpacing:3, color:"#10B981", textTransform:"uppercase", fontFamily:"sans-serif", marginBottom:4 }}>Trip Planner</div>
          <div style={{ fontSize:22, fontWeight:400, color:"#f0e6d3" }}>My Kos Trip</div>
          <div style={{ fontSize:12, color:"#64748b", fontFamily:"sans-serif", marginTop:2 }}>{totalPlaces} place{totalPlaces!==1?"s":""} planned across {trip.activeDays} day{trip.activeDays!==1?"s":""}</div>
        </div>
        <button onClick={() => setConfirmClear(true)} style={{ padding:"8px 12px", background:"rgba(239,68,68,0.1)", border:"1px solid rgba(239,68,68,0.25)", borderRadius:10, color:"#ef4444", fontSize:12, cursor:"pointer", fontFamily:"sans-serif" }}>
          Clear all
        </button>
      </div>

      {/* Confirm clear */}
      {confirmClear && (
        <div style={{ background:"rgba(239,68,68,0.1)", border:"1px solid rgba(239,68,68,0.3)", borderRadius:14, padding:"14px 16px", marginBottom:16, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
          <div style={{ fontSize:13, color:"#f0e6d3", fontFamily:"sans-serif" }}>Clear your entire trip?</div>
          <div style={{ display:"flex", gap:8 }}>
            <button onClick={clearAll} style={{ padding:"7px 14px", background:"#ef4444", border:"none", borderRadius:8, color:"#fff", fontSize:12, cursor:"pointer", fontFamily:"sans-serif" }}>Yes, clear</button>
            <button onClick={() => setConfirmClear(false)} style={{ padding:"7px 14px", background:"rgba(255,255,255,0.06)", border:"1px solid rgba(240,230,211,0.15)", borderRadius:8, color:"#94a3b8", fontSize:12, cursor:"pointer", fontFamily:"sans-serif" }}>Cancel</button>
          </div>
        </div>
      )}

      {/* How many days */}
      <div style={{ background:"rgba(255,255,255,0.04)", border:"1px solid rgba(240,230,211,0.08)", borderRadius:14, padding:"14px 16px", marginBottom:16 }}>
        <div style={{ fontSize:12, color:"#94a3b8", fontFamily:"sans-serif", marginBottom:10 }}>How many days is your trip?</div>
        <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
          {[1,2,3,4,5,6,7].map(n => (
            <button key={n} onClick={() => setDays(n)} style={{ width:38, height:38, borderRadius:10, border:trip.activeDays===n?"1.5px solid #10B981":"1.5px solid rgba(240,230,211,0.15)", background:trip.activeDays===n?"rgba(16,185,129,0.2)":"rgba(255,255,255,0.04)", color:trip.activeDays===n?"#10B981":"#94a3b8", fontSize:14, cursor:"pointer", fontFamily:"sans-serif", fontWeight:600 }}>
              {n}
            </button>
          ))}
        </div>
      </div>

      {/* Day tabs */}
      <div style={{ display:"flex", gap:6, marginBottom:16, overflowX:"auto", paddingBottom:4 }}>
        {activeDayKeys.map(day => {
          const count = (trip.days[day]||[]).length;
          return (
            <button key={day} onClick={() => { setActiveDay(day); setAdding(false); }} style={{ flexShrink:0, padding:"8px 14px", borderRadius:12, border:activeDay===day?"1.5px solid #10B981":"1.5px solid rgba(240,230,211,0.12)", background:activeDay===day?"rgba(16,185,129,0.15)":"rgba(255,255,255,0.04)", color:activeDay===day?"#10B981":"#64748b", fontSize:13, cursor:"pointer", fontFamily:"sans-serif", fontWeight:activeDay===day?600:400, display:"flex", alignItems:"center", gap:6 }}>
              {day}
              {count > 0 && <span style={{ background:activeDay===day?"#10B981":"rgba(255,255,255,0.1)", color:activeDay===day?"#fff":"#64748b", fontSize:10, fontWeight:700, padding:"1px 6px", borderRadius:20 }}>{count}</span>}
            </button>
          );
        })}
      </div>

      {/* Day itinerary */}
      {dayItems.length === 0 && !adding && (
        <div style={{ textAlign:"center", padding:"30px 0 20px", color:"#475569", fontFamily:"sans-serif", fontSize:14 }}>
          <div style={{ fontSize:40, marginBottom:10 }}>📍</div>
          <div style={{ marginBottom:4, color:"#64748b" }}>Nothing planned for {activeDay} yet</div>
          <div style={{ fontSize:12, color:"#334155" }}>Tap below to start adding places</div>
        </div>
      )}

      {dayItems.map((item, idx) => {
        const col = CAT_COLOR_LOCAL[item.cat] || "#94a3b8";
        const isExpanded = expandDay === item.id;
        return (
          <div key={item.id} style={{ background:"rgba(255,255,255,0.04)", border:"1px solid rgba(240,230,211,0.08)", borderRadius:14, marginBottom:10, overflow:"hidden" }}>
            <div style={{ display:"flex", alignItems:"center", padding:"12px 14px", gap:10 }}>
              {/* Order badge */}
              <div style={{ width:26, height:26, borderRadius:"50%", background:col+"22", border:"1px solid "+col+"44", display:"flex", alignItems:"center", justifyContent:"center", fontSize:11, fontWeight:700, color:col, flexShrink:0 }}>
                {idx+1}
              </div>
              <span style={{ fontSize:22 }}>{item.emoji}</span>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:14, fontWeight:600, color:"#f0e6d3" }}>{item.name}</div>
                <div style={{ fontSize:11, color:col, fontFamily:"sans-serif", textTransform:"capitalize" }}>{item.cat}</div>
              </div>
              {/* Controls */}
              <div style={{ display:"flex", gap:4 }}>
                <button onClick={() => setExpandDay(isExpanded?null:item.id)} style={{ width:28, height:28, borderRadius:8, border:"1px solid rgba(240,230,211,0.12)", background:"rgba(255,255,255,0.05)", color:"#64748b", fontSize:13, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center" }}>
                  {isExpanded ? "▲" : "▼"}
                </button>
                <button onClick={() => moveUp(activeDay, idx)} disabled={idx===0} style={{ width:28, height:28, borderRadius:8, border:"1px solid rgba(240,230,211,0.12)", background:"rgba(255,255,255,0.05)", color:idx===0?"#334155":"#94a3b8", fontSize:12, cursor:idx===0?"default":"pointer", display:"flex", alignItems:"center", justifyContent:"center" }}>↑</button>
                <button onClick={() => moveDown(activeDay, idx)} disabled={idx===dayItems.length-1} style={{ width:28, height:28, borderRadius:8, border:"1px solid rgba(240,230,211,0.12)", background:"rgba(255,255,255,0.05)", color:idx===dayItems.length-1?"#334155":"#94a3b8", fontSize:12, cursor:idx===dayItems.length-1?"default":"pointer", display:"flex", alignItems:"center", justifyContent:"center" }}>↓</button>
                <button onClick={() => removePlace(activeDay, item.id)} style={{ width:28, height:28, borderRadius:8, border:"1px solid rgba(239,68,68,0.2)", background:"rgba(239,68,68,0.08)", color:"#ef4444", fontSize:14, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center" }}>×</button>
              </div>
            </div>
            {/* Note input */}
            {isExpanded && (
              <div style={{ padding:"0 14px 12px" }}>
                <input
                  value={item.note}
                  onChange={e => updateNote(activeDay, item.id, e.target.value)}
                  placeholder="Add a personal note (e.g. 8pm reservation, bring sunscreen...)"
                  style={{ width:"100%", boxSizing:"border-box", padding:"9px 12px", background:"rgba(255,255,255,0.06)", border:"1px solid rgba(240,230,211,0.12)", borderRadius:10, color:"#f0e6d3", fontSize:12, fontFamily:"sans-serif", outline:"none" }}
                />
              </div>
            )}
          </div>
        );
      })}

      {/* Add place button */}
      {!adding && (
        <button onClick={() => setAdding(true)} style={{ width:"100%", padding:"13px", background:"rgba(16,185,129,0.1)", border:"1.5px dashed rgba(16,185,129,0.4)", borderRadius:14, color:"#10B981", fontSize:14, cursor:"pointer", fontFamily:"sans-serif", fontWeight:600, marginTop:4, display:"flex", alignItems:"center", justifyContent:"center", gap:8 }}>
          <span style={{ fontSize:18 }}>+</span> Add a place to {activeDay}
        </button>
      )}

      {/* Place picker */}
      {adding && (
        <div style={{ background:"rgba(255,255,255,0.03)", border:"1px solid rgba(240,230,211,0.1)", borderRadius:16, padding:"16px", marginTop:8 }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
            <div style={{ fontSize:14, fontWeight:600, color:"#f0e6d3" }}>Add to {activeDay}</div>
            <button onClick={() => { setAdding(false); setSearch(""); }} style={{ background:"none", border:"none", color:"#64748b", cursor:"pointer", fontSize:18 }}>×</button>
          </div>
          {/* Search */}
          <div style={{ position:"relative", marginBottom:12 }}>
            <span style={{ position:"absolute", left:12, top:"50%", transform:"translateY(-50%)", fontSize:14 }}>🔍</span>
            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search places..." style={{ width:"100%", boxSizing:"border-box", padding:"10px 14px 10px 36px", background:"rgba(255,255,255,0.06)", border:"1px solid rgba(240,230,211,0.12)", borderRadius:12, color:"#f0e6d3", fontSize:13, fontFamily:"sans-serif", outline:"none" }}/>
          </div>
          {/* Category filter */}
          {!search && (
            <div style={{ display:"flex", gap:6, marginBottom:12, overflowX:"auto" }}>
              {CATS.map(c => (
                <button key={c.key} onClick={() => setAddCat(c.key)} style={{ flexShrink:0, padding:"6px 12px", borderRadius:20, border:addCat===c.key?"1.5px solid "+c.color:"1.5px solid rgba(240,230,211,0.12)", background:addCat===c.key?c.color+"22":"rgba(255,255,255,0.04)", color:addCat===c.key?c.color:"#64748b", fontSize:12, cursor:"pointer", fontFamily:"sans-serif" }}>
                  {c.icon} {c.label}
                </button>
              ))}
            </div>
          )}
          {/* Results */}
          <div style={{ maxHeight:260, overflowY:"auto" }}>
            {searchFiltered.length === 0 && <div style={{ textAlign:"center", padding:"20px 0", color:"#475569", fontFamily:"sans-serif", fontSize:13 }}>No places found</div>}
            {searchFiltered.map(item => {
              const col = CAT_COLOR_LOCAL[item.cat] || "#94a3b8";
              return (
                <div key={item.id} onClick={() => addPlace(item)} style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 12px", borderRadius:12, marginBottom:6, cursor:"pointer", background:"rgba(255,255,255,0.04)", border:"1px solid rgba(240,230,211,0.06)" }}>
                  <span style={{ fontSize:22 }}>{item.emoji}</span>
                  <div style={{ flex:1 }}>
                    <div style={{ fontSize:13, fontWeight:600, color:"#f0e6d3" }}>{item.name}</div>
                    <div style={{ fontSize:11, color:col, fontFamily:"sans-serif", textTransform:"capitalize" }}>{item.cat}</div>
                  </div>
                  <div style={{ fontSize:18, color:"#10B981" }}>+</div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Trip summary */}
      {totalPlaces > 0 && !adding && (
        <div style={{ marginTop:20, background:"rgba(16,185,129,0.06)", border:"1px solid rgba(16,185,129,0.2)", borderRadius:16, padding:"16px" }}>
          <div style={{ fontSize:13, fontWeight:600, color:"#10B981", marginBottom:12, fontFamily:"sans-serif" }}>📋 Trip Summary</div>
          {activeDayKeys.map(day => {
            const items = trip.days[day] || [];
            if (items.length === 0) return null;
            return (
              <div key={day} style={{ marginBottom:10 }}>
                <div style={{ fontSize:11, color:"#64748b", fontFamily:"sans-serif", fontWeight:700, textTransform:"uppercase", letterSpacing:1, marginBottom:4 }}>{day}</div>
                {items.map((item,i) => (
                  <div key={item.id} style={{ fontSize:13, color:"#94a3b8", fontFamily:"sans-serif", padding:"2px 0", display:"flex", gap:8 }}>
                    <span style={{ color:"#334155" }}>{i+1}.</span>
                    <span>{item.emoji} {item.name}</span>
                    {item.note && <span style={{ color:"#475569", fontStyle:"italic" }}>— {item.note}</span>}
                  </div>
                ))}
              </div>
            );
          })}
        </div>
      )}

      {/* Save button */}
      <button onClick={handleSave} style={{ width:"100%", marginTop:16, padding:"14px", background:saved?"#10B981":"rgba(16,185,129,0.15)", border:"1.5px solid "+saved?"#10B981":"rgba(16,185,129,0.4)", borderRadius:14, color:saved?"#fff":"#10B981", fontSize:15, cursor:"pointer", fontFamily:"sans-serif", fontWeight:600, transition:"all 0.3s" }}>
        {saved ? "✓ Trip Saved!" : "💾 Save My Trip"}
      </button>
      <div style={{ textAlign:"center", fontSize:11, color:"#334155", fontFamily:"sans-serif", marginTop:6 }}>Your trip is saved to this device</div>
    </div>
  );
}

    hour < 5  ? ["Still up?", ""] :
    hour < 11 ? ["What's the plan", "today?"] :
    hour < 15 ? ["Beach, shade", "or both?"] :
    hour < 18 ? ["Where's the", "sunset tonight?"] :

              <div style={{ textAlign:"center" }}>
                <div style={{ fontSize:14, color:"#f0e6d3", fontWeight:600, fontFamily:"sans-serif" }}>{t.label}</div>
                <div style={{ fontSize:11, color:"#64748b", fontFamily:"sans-serif", marginTop:2 }}>{t.sub}</div>
              </div>
            </div>
          ))}
        </div>

        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:22 }}>
          {QUICK.map(q => (
            <div key={q.nav} onClick={() => onNav(q.nav)} style={{ background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.07)", borderRadius:14, padding:"12px 13px", display:"flex", alignItems:"center", gap:9, cursor:"pointer" }}>

  function temp(c) { return unit === "C" ? Math.round(c) + "°C" : toF(c) + "°F"; }

  const fetchWeather = () => {
    setLoading(true);
    setError(null);
    fetch(
      "https://api.open-meteo.com/v1/forecast?latitude="+KOS_LAT+"&longitude="+KOS_LNG+
      "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,relative_humidity_2m,uv_index"+

      .then(r => { if (!r.ok) throw new Error("Network error"); return r.json(); })
      .then(data => { setWx(data); setLoading(false); })
      .catch(() => { setError(true); setLoading(false); });
  };

  React.useEffect(() => { fetchWeather(); }, []);

  if (loading) return (
    <div style={{ padding:"24px 16px 120px" }}>

            { icon:"dive", color:"#0EA5E9", title:"Excellent Snorkelling & Diving", desc:"Maximum underwater visibility today. Head to Agios Fokas or Psalidi for snorkelling, or book a dive at the Kefalos sites.", beach:"Agios Fokas, Psalidi, Kefalos" },
            { icon:"cycle", color:"#10B981", title:"Perfect Cycling Day", desc:"No wind, dry roads, sunshine. Ideal for cycling the coastal path or heading up to Zia on two wheels.", beach:null },
            { icon:"sail", color:"#6366F1", title:"Sunset Cruise Tonight", desc:"Flat calm makes for perfect sailing. Book a sunset cruise from the harbour, conditions don't get better than this.", beach:null },

        } else if (isMeltemi) {
          conditions = [
            { icon:"surf", color:"#0EA5E9", title:"Prime Windsurfing & Kitesurfing", desc:"The Meltemi is blowing! North coast conditions are world-class right now. Marmari and Mastichari are firing. Get on the water.", beach:"Marmari, Mastichari, Psalidi" },
            { icon:"swim", color:"#10B981", title:"Swim on the South Coast", desc:"North coast is choppy today, but the south coast is sheltered from the Meltemi. Head to Kefalos, Agios Theologos or Limnionas for calm clear water.", beach:"Kefalos, Agios Theologos, Limnionas, Camel Beach" },
            { icon:"climb", color:"#F97316", title:"Day Trip to Kalymnos", desc:"Meltemi means rock climbing conditions in Kalymnos are perfect. Take the morning ferry and spend the day on the cliffs.", beach:null },
            { icon:"jeep", color:"#EAB308", title:"Jeep Safari Inland", desc:"Wind too strong for the beach? Head into the hills, Zia, Pyli and the mountain villages are sheltered and beautiful.", beach:null },
          ];
        } else if (isSouthWind && isWindy) {
          conditions = [
            { icon:"swim", color:"#0EA5E9", title:"North Coast Calm Today", desc:"South winds mean the north coast beaches are sheltered and calm. Tigaki, Marmari and Mastichari will have flat water.", beach:"Tigaki, Marmari, Mastichari, Lambi" },
            { icon:"dive", color:"#10B981", title:"Good Snorkelling, North Beaches", desc:"Calm water on the north coast means excellent visibility for snorkelling today.", beach:"Tigaki, Psalidi, Lambi" },
            { icon:"sail", color:"#6366F1", title:"Sailing Conditions", desc:"A south breeze makes for pleasant sailing. Check with harbour operators for conditions before booking.", beach:null },
          ];
        } else if (isLightBreeze) {
          conditions = [
            { icon:"swim", color:"#0EA5E9", title:"Great Swimming Everywhere", desc:"Light breeze keeps things comfortable without disturbing the sea. All beaches are in good condition today.", beach:"All beaches" },
            { icon:"cycle", color:"#10B981", title:"Ideal for Cycling", desc:"A light breeze is perfect cycling weather. Head along the coastal path or up toward the villages.", beach:null },
            { icon:"fish", color:"#EC4899", title:"Good Fishing Conditions", desc:"Light winds are ideal for shore fishing. Contact Dream Catch Kos for a session at one of their secret spots.", beach:null },
            { icon:"surf", color:"#A855F7", title:"Beginner Windsurfing", desc:"Light and consistent breeze, perfect conditions for learning to windsurf. Schools at Marmari welcome all levels.", beach:"Marmari" },

        } else if (isWindy) {
          conditions = [
            { icon:"surf", color:"#0EA5E9", title:"Windsurfing & Kitesurfing", desc:"Good wind today, north coast conditions are ideal for intermediate and advanced riders. Marmari schools are open.", beach:"Marmari, Mastichari" },
            { icon:"swim", color:"#10B981", title:"Seek Sheltered Beaches", desc:"Avoid exposed north-facing beaches today. The south and southwest coastline will be much calmer.", beach:"Kefalos, Agios Theologos, Camel Beach, Limnionas" },
            { icon:"jeep", color:"#EAB308", title:"Explore the Villages", desc:"A breezy day is perfect for heading inland to Zia, Pyli or Antimachia, cooler, sheltered and beautiful.", beach:null },
          ];
        } else if (isVeryWindy) {
          conditions = [
            { icon:"surf", color:"#0EA5E9", title:"Expert Kite & Windsurf Conditions", desc:"Strong winds, advanced riders only. Check with schools at Marmari before heading out. Not recommended for beginners.", beach:"Marmari (advanced only)" },

          conditions = [
            { icon:"swim", color:"#0EA5E9", title:"Good Swimming Conditions", desc:"Decent beach day. Check conditions locally before heading to exposed beaches.", beach:"All beaches" },
            { icon:"cycle", color:"#10B981", title:"Great for Cycling", desc:"Ideal weather for exploring the island on two wheels. The coastal path is beautiful.", beach:null },
            { icon:"sail", color:"#6366F1", title:"Boat Trips Available", desc:"Conditions are suitable for boat excursions. Check with harbour operators for availability.", beach:null },
          ];
        }

        // UV warning if needed
        if (uv >= 8 && !isRaining) {
          conditions.push({ icon:"sunscreen", color:"#ef4444", title:"Very High UV, Protect Yourself", desc:"UV index is "+Math.round(uv)+" today, very high. High-factor sunscreen essential, reapply every 2 hours. Seek shade between 12pm and 4pm.", beach:null });
        }

        return (
          <div style={{ marginTop:16 }}>
            <div style={{ fontSize:11, letterSpacing:3, color:"#94a3b8", textTransform:"uppercase", fontFamily:"sans-serif", marginBottom:12 }}>Today's Activity Guide</div>
            {conditions.map((c, i) => (
              <div key={i} style={{ background:"rgba(255,255,255,0.04)", border:"1px solid "+c.color+"30", borderRadius:14, padding:"14px 16px", marginBottom:10 }}>
                <div style={{ display:"flex", gap:12, alignItems:"flex-start" }}>

                  <div style={{ flex:1 }}>
                    <div style={{ fontSize:14, fontWeight:600, color:"#f0e6d3", marginBottom:4, fontFamily:"sans-serif" }}>{c.title}</div>
                    <div style={{ fontSize:12, color:"#94a3b8", fontFamily:"sans-serif", lineHeight:1.5 }}>{c.desc}</div>
                    {c.beach && (
                      <div style={{ marginTop:6, display:"flex", alignItems:"center", gap:5 }}>
                        <NavIcon name="nearby" color={c.color} size={11}/>
                        <span style={{ fontSize:11, color:c.color, fontFamily:"sans-serif" }}>{c.beach}</span>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            ))}
          </div>
        );
      })()}

      <div style={{ marginTop:10, textAlign:"center", fontSize:11, color:"#334155", fontFamily:"sans-serif" }}>
        Powered by Open-Meteo · Updates hourly
      </div>
    </div>
  );
}

function NearbyTab() {
  const [activeCat, setActiveCat] = useState("supermarket");
  const [location, setLocation] = useState(null);
  const [locError, setLocError] = useState(null);
  const [loading, setLoading] = useState(false);
  const [results, setResults] = useState([]);
  const [searched, setSearched] = useState(false);

  const cat = NEARBY_CATS.find(c => c.key === activeCat);

  function getLocation() {
    setLoading(true);
    setLocError(null);
    setResults([]);
    setSearched(false);
    if (!navigator.geolocation) {
      setLocError("Geolocation is not supported by your browser.");
      setLoading(false);
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos => {
        setLocation({ lat: pos.coords.latitude, lng: pos.coords.longitude });
        setLoading(false);
        setSearched(true);
      },
      err => {
        setLocError("Could not get your location. Please make sure location access is enabled for this site.");
        setLoading(false);
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  // Open Google Maps search near the user
  function openMapsSearch() {
    if (!location) return;
    const query = encodeURIComponent(cat.query + " near me");
    const url = "https://www.google.com/maps/search/" + query + "/@" + location.lat + "," + location.lng + ",15z";
    window.open(url, "_blank");
  }

  // Build direct Google Maps links for common spots
  function buildPlaceLink(lat, lng, name) {
    return "https://www.google.com/maps/search/" + encodeURIComponent(name) + "/@" + lat + "," + lng + ",17z";
  }

  // Haversine distance in km
  function dist(lat1, lng1, lat2, lng2) {
    const R = 6371;
    const dLat = (lat2-lat1) * Math.PI/180;
    const dLng = (lng2-lng1) * Math.PI/180;
    const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  // Static known locations for common places on Kos (fallback when Maps API not available)
  const KNOWN_PLACES = {
    supermarket: [
      { name:"AB Vassilopoulos Kos Town",    lat:36.8938, lng:27.2882, note:"Large supermarket, full range" },
      { name:"Lidl Kos",                     lat:36.8870, lng:27.2710, note:"Budget supermarket, great for basics" },

      { name:"Super Market Tigaki",          lat:36.8660, lng:27.0690, note:"Convenient for Tigaki area" },
      { name:"Mini Market Kardamena",        lat:36.7842, lng:27.1338, note:"Local mini market in Kardamena" },
      { name:"Mini Market Mastichari",       lat:36.8465, lng:27.0068, note:"Handy for Mastichari visitors" },
      { name:"Bazaar Supermarket Kos Town",  lat:36.8930, lng:27.2860, note:"Central location, long opening hours" },
      { name:"Mini Market Kefalos",          lat:36.7380, lng:26.9980, note:"Serves the Kefalos peninsula area" },
      { name:"Blue Market",                  lat:36.8843019699968, lng:27.283710579036534, note:"Well-stocked local market, handy for self-catering" },

      {/* Results */}
      {(searched || true) && sortedPlaces.map((place, i) => {
        const d = location ? dist(location.lat, location.lng, place.lat, place.lng) : null;
        return (
          <a key={i} href={buildPlaceLink(place.lat, place.lng, place.name)} target="_blank" rel="noreferrer" style={{ textDecoration:"none", display:"block", marginBottom:10 }}>
            <div style={{ background:"rgba(255,255,255,0.04)", border:"1px solid rgba(240,230,211,0.08)", borderRadius:14, padding:"14px 16px", display:"flex", alignItems:"center", gap:12, transition:"all 0.2s" }}>

              </div>

      {searched && (

        </button>
      )}

      <style dangerouslySetInnerHTML={{__html:"@keyframes spin { to { transform: rotate(360deg); } }"}}/>
    </div>
  );
}

function buildBookingUrl(phone, whatsapp, name) {
  if (whatsapp) {
    var num = whatsapp.replace(/[^0-9]/g, "");
    var msg = "Hi! I would like to make a reservation at " + name + ". Could you help me with availability?";
    return "https://wa.me/" + num + "?text=" + encodeURIComponent(msg);
  }
  return "tel:" + phone;
}

            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"12px 24px 16px" }}>
              <div>
                <div style={{ fontSize:18, fontWeight:600, color:"#f0e6d3", fontFamily:"Georgia, serif", letterSpacing:2 }}>KOS UNLOCKED</div>
                <div style={{ fontSize:11, color:"#475569", fontFamily:"sans-serif", letterSpacing:1 }}>Your local island guide</div>
              </div>
              <button onClick={() => setMenuOpen(false)} style={{ background:"rgba(255,255,255,0.08)", border:"1px solid rgba(255,255,255,0.1)", borderRadius:"50%", width:36, height:36, cursor:"pointer", color:"#94a3b8", fontSize:18, display:"flex", alignItems:"center", justifyContent:"center" }}>✕</button>
            </div>
            {/* Nav items — 2 column grid */}
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, padding:"0 16px" }}>
              {NAV.map(n => {
                const isActive = nav === n.key;
                return (
                  <button key={n.key} onClick={() => { setNav(n.key); setOpenTT(null); setMenuOpen(false); window.scrollTo(0,0); }} style={{ padding:"14px 16px", borderRadius:16, border:"1.5px solid", borderColor:isActive?"rgba(14,165,233,0.5)":"rgba(255,255,255,0.08)", background:isActive?"linear-gradient(135deg,rgba(14,165,233,0.2),rgba(14,165,233,0.08))":"rgba(255,255,255,0.04)", cursor:"pointer", display:"flex", alignItems:"center", gap:10, transition:"all 0.15s" }}>
                    <NavIcon name={n.icon} color={isActive?"#7dd3fc":"#64748b"} size={20}/>
                    <span style={{ fontSize:14, color:isActive?"#7dd3fc":"#94a3b8", fontFamily:"sans-serif", fontWeight:isActive?600:400, textAlign:"left" }}>{n.label}</span>
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      )}

      <style dangerouslySetInnerHTML={{__html:`
        @keyframes slideUp {
          from { transform: translateX(-50%) translateY(100%); }
          to   { transform: translateX(-50%) translateY(0); }
        }
      `}}/>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
